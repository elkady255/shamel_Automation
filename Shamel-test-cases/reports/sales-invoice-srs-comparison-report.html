const T = {"en":{"dir":"ltr","lang":"en","btn":"عربي","title":"Sales Invoice SRS Comparison Report","eyebrow":"QA bug report · Selling › Sales Invoice (full SRS comparison)","h1":"Sales Invoice: 21 new differences from the SRS; an invoice can now be created and submitted from the screen, but the loyalty points section is missing","lede":"Full comparison of the Sales Invoice list, the Add screen (Details, General Information and More Information tabs), the Details screen with its actions (Submit, Cancel Document, Amend, Create, Actions › UnReconcile, View, Linked Records) and the server rules with the SRS (pages 241 to 334), on the test server: 98 checks (77 matched, 21 differ). A valid invoice can be created, saved and submitted from the new screen (ACC-SINV-2026-02789, status Unpaid), and the statuses, payments, partial and full returns, the edit refusals and the Connections tab follow the SRS. The most important difference is SI-12: the Loyalty Points Redemption section (and the Loyalty Points display) is not on the screen, even for a customer who has a Loyalty Program. Other important points are that Create › Return and Create › Delivery Note save a document at once (SI-13) and give the return a group warehouse (SI-14), that Edit Row always opens with an \"Item code is required\" error (SI-15), and that the Get Items From popups stop at 50 documents (SI-16). The earlier Sales Invoice report (SI-01 to SI-11) was re-checked: five of its points are still open and four are fixed; see \"Observations\".","meta":[["Environment","test.hr.azzrk.com"],["Browser","Chromium (desktop)"],["User","Administrator"],["Company","Ahmed Ebrahim CO."],["Language","Arabic interface (account language: ar)"],["Run date","2026-11-18"],["Method","Playwright browser checks and calls to the create endpoint and the standard API (not saved as a spec yet)"],["Bug IDs","SI-12 to SI-32 (new; SI-01 to SI-11 are in the earlier report)"]],"stats":["Bugs reported","Critical","High","Medium","Low","Ba nment is present here (as in the Quotation list)","Statuses on the list: Unpaid (غير مدفوعة), Partially Paid (مدفوعة جزئيًا), Fully Paid (مدفوعة بالكامل), Overdue (متأخرة), Return (مرتجع), Draft, Cancelled; a fully returned invoice shows Credit Status \"Fully Credited\" (دائن بالكامل)","Add screen: Company, Company Tax ID, Series, Customer, Customer Name and Tax ID (filled when the customer is picked), Posting Date and Time read-only until \"Edit Posting Date and Time\" is ticked, Payment Due Date, Is Consolidated, Is Return, Consider for Tax Withholding, Is Rate Adjustment Entry, Cost Center, Project, Currency, Exchange Rate, Price List, Price List Currency, Price List Exchange Rate, Ignore Pricing Rule, Scan Barcode (keeps 100 characters), Items table with Available Qty and Shortage Qty, Taxes and Charges, Shipping Rule, Totals, Additional Discount, Coupon Code, Bundle Items and Total Billing Hours","Update Stock and Source Warehouse are hidden because \"Allow Update Stock in Sales Invoice\" is off in Selling Settings (the SRS shows them only when it is on); the warehouse dropdown offers only the 7 non-group warehouses of the company","A valid invoice is saved from the screen as a Draft and then submitted with the Submit button, with no Sales Order or Delivery Note (Selling Settings now has \"Sales Order Required\" and \"Delivery Note Required\" set to No); empty form, missing customer and missing items give inline messages; quantity 0 and a negative quantity give \"الكمية يجب أن تكون أكبر من صفر\"","Edit Row fields (item, group, name, brand, image, description, quantity, available and shortage, UOM, conversion factor, price list rate, margin, discounts, accounts, deferred revenue, warehouse, weights, serial and batch, references) and the tax row Edit Row fields (mode, account, description, included in rate, considered in paid amount, cost center, project, amounts and company-currency amounts, Don't Recompute Tax)","General Information: Payments with Mode of Payment and amount, Changes, Allocate Advance Automatically (FIFO), Only Include Allocated Payments, Get Advance Received, Write Off with Write Off Outstanding Amount, Billing, Shipping and Company Address with contacts, Payment Terms Template and Payment Schedule, Terms and Terms Content (keeps 500 characters)","More Information: Invoice Status, Credit Status, Refund Status, Debit To, Is Opening Entry, Against Income Account, Paid Amount, Credit Amount, Credit Allocated, Refund Amount, Letter Head, Language, Print without Amount and Group Same Items, Territory, Customer Purchase Order (maxlength 100), Customer Purchase Order Date and Customer Group; Commission, Sales Team, Auto Repeat and UTM are hidden as the SRS says","Details of a submitted invoice: read-only, with Create Quality Inspection, View, Cancel Document and Create; of a Draft: Get Items From, Submit and Save; of a Cancelled one: Amend. The top icons are Delete, Share, Print, Attachments, Tags and Assign. Hold stays hidden as the SRS says","Create menu: Return / Credit Note, Delivery Note, Payment (only while the outstanding is not 0) and Maintenance Schedule; Actions › \"إلغاء التسوية\" (UnReconcile) on a Fully Paid invoice; View › View Accounting Ledger; Linked Records tab with the ten doctypes of the SRS (Sales Invoice, Delivery Note, Sales Order, Quotation, POS Invoice, Payment Entry, Payment Request, Journal Entry, Invoice Discounting, Dunning) and the two Payment Entries of ACC-SINV-2026-02791","Get Items From: Sales Order (only To Bill), Quotation (empty for the test customer, which has no quotations) and Delivery Note (To Bill and Partially Billed) popups with Search by Name and Customer, and the items arrive in the table with quantity and rate","Server: a customer, items and company are mandatory; quantity 0 is refused; a due date before the posting date is refused (before it was silently reset); a posting date in the past needs \"Edit Posting Date and Time\"; discount over the total is refused; discount 10 % on Grand Total gives 180; tax 15 % on net total gives 230; payment terms template (100 % today) fills the schedule; sales team must total 100 %; commission rate above 100 is refused; payment terms must equal the grand total; the customer PO is capped (see SI-23); an unknown warehouse of another company is refused","Payments and returns: a payment of 40 gives Partly Paid (outstanding 160), the rest gives Paid (0); a payment above the outstanding is refused; an invoice with an allocated payment cannot be cancelled (\"linked with Payment Entry\"); a return above the remaining quantity or above the original rate is refused; a return of 1 of 2 and then 1 of 2 is accepted and a third is refused; a submitted invoice refuses a new posting date and a new quantity"],"noTitle":"Not executed, and why","no":["Delete \"Yes\" and the warnings for an invoice that is amended or linked to other documents (Delete was never confirmed on any record)","Hold, Resume, Close and Re-open (the Hold button is hidden as the SRS says; Close and Re-open are not on the screen, see SI-11 in the earlier report)","Earning loyalty points on submit and redeeming them on the screen (the section is missing, SI-12; redemption through the create endpoint was refused for lack of points and no points were added to the customer)","Update Stock, Source Warehouse, the shortage rule (Ignore / Warn / Block) and Create Quality Inspection with a stock-updating invoice (\"Allow Update Stock in Sales Invoice\" is off in Selling Settings and was not changed); Selling Settings has the Sales Invoice shortage action set to Warn","POS fields (Include Payment, POS Profile, Is Created Using POS, POS Closing Entry), because the POS module is not part of this comparison","Serial and batch pick, Serial and Batch Bundle, Product Bundle rows (an earlier test found no Bundle Items rows when Update Stock is off), deferred revenue dates, assets and finance book, tax withholding, Shipping Rule and Incoterm, the Exchange Rate rules of Accounts Settings (fetching rule, no rate found, the role that edits the rate)","Get Advance Received and the Advances table on the screen, and the Payment Terms Template filling the schedule on the screen (the template filling was checked through the create endpoint), the Terms template filling the content, and the contact selection rules (Preferred Billing Contact, Primary, latest)","Permissions, closed accounting period and credit limit (they need a second user or a settings change); Amend of a Cancelled invoice that has payments"],"bugs":"Bugs","search":"Search id, title, test case","allSev":"All severities","allLayer":"Backend and Frontend","allStatus":"All statuses","of":"of","sev":{"Critical":"Critical","High":"High","Medium":"Medium","Low":"Low"},"status":{"New":"New","In Progress":"In Progress","Fixed":"Fixed","Retest Passed":"Retest Passed","Reopened":"Reopened","Not a Bug":"Not a Bug","Cannot Reproduce":"Cannot Reproduce","Deferred":"Deferred"},"f":{"tc":"Test case","srs":"SRS reference","steps":"Steps to reproduce","exp":"Expected result","act":"Actual result","code":"Backend evidence (request and response)","shots":"Screenshots","fix":"Suggested fix"},"srsPrefix":"Selling SRS v1.0, Sales Invoice","fb":{"title":"Developer feedback","status":"Status","as":"Assigned to","build":"Build","cm":"Comment","save":"Save feedback","devName":"Developer name","buildPh":"Fixed in build / commit","cmPh":"Root cause, fix notes, or questions for the tester","last":"Last update","by":"by","none":"No feedback yet","saving":"Saving…","err":"Could not save. Try again.","ok":"Saved for everyone who opens this report. The tester sees it and retests.","ro":"You can read feedback here. Ask the report owner for contributor access to write.","na":"Feedback storage is not available in this view."},"none":"No bugs match these filters.","rt":"Retest plan: where we stopped","rtBody":[["p","Round 3 of the Sales Invoice is finished. Retesting starts when the developers mark SI-12 to SI-20 as Fixed here (or tell the tester). SI-12 comes first because it blocks a whole business scenario (redeeming and restoring loyalty points)."],["h","When a fix lands"],["ol",["Repeat SI-12 on the General Information and More Information tabs with the customer \"PW Packing Customer\" (Golden Program), then run the earn, redeem and return-restore scenarios of the SRS.","Repeat SI-13 to SI-16 on the screen (Create menu, Edit Row, Get Items From) and the server cases through the create endpoint (SI-18 to SI-20, SI-23 to SI-25).","Run the cases listed under Not executed.","Update each bug status in the feedback box below."]],["h","Test data and records left in the system"],["p","The checks created about 60 test Sales Invoices for the customer \"PW Packing Customer\": ACC-SINV-2026-02758 to ACC-SINV-2026-02816 (Drafts, except: 02789, 02791 to 02797 and 02801 submitted; 02799 Cancelled; 02790 and 02798 are Draft return and debit note), two Payment Entries (ACC-PAY-2026-03053 and ACC-PAY-2026-03054, both against ACC-SINV-2026-02791) and one Draft Delivery Note (MAT-DN-2026-00660, created by Create › Delivery Note). Nothing was deleted. The existing invoices were only read; ACC-SINV-2026-02754, 02755 and 02757 were opened without changes."]],"obs":["Earlier report, status now (SI-01 to SI-11). Still open: SI-01 (a write off larger than the invoice is accepted: 900 on 200 gives outstanding -700), SI-09 (a negative write off is accepted: outstanding 205), SI-03 (the bulk bar of a submitted invoice still offers Delete), SI-05 (the default price list is in AFN with no exchange rate: opening an old Draft shows \"No exchange rate was found for AFN to SAR\", and an invoice made from a Sales Order saves with the same message) and SI-11 (Close and Re-open are not on the screen; Hold is hidden as the SRS says). Fixed: SI-04 (Print without Amount and Group Same Items are there), SI-07 (the list shows Partially Paid and Fully Paid), SI-08 (a due date before the posting date is now refused with a message instead of being reset) and SI-10 (Get Items From opens and its three popups work). Changed: SI-02 (Selling Settings now has Sales Order Required and Delivery Note Required set to No, so an invoice without them is by configuration). Not re-tested: SI-06 (the tax template VAT - E: choosing a template through the create endpoint does not fill the tax rows, so it needs a screen check).","Fields that are on the screen but not in the SRS: Invoice Type (mandatory: Sales Invoice, Prepayment Invoice, Credit Note, Debit Note), Credit / Debit Note Reason (mandatory on returns and debit notes), the ZATCA switches (Third-Party Issued, Nominal Supply, Export Invoice, Self-Billed Invoice, Summary Invoice), a document-level Discount Account, the section \"Prepayment Reference Invoices\", and the ZATCA fields on the tax row (Type, Tax Code, Exemption Reason). They look intentional (e-invoicing) but the SRS should describe them.","The SRS Overdue rule is reversed: it says Overdue when \"the due date is greater than the current date\"; the system shows Overdue when the due date has passed (ACC-SINV-2026-02797, due 2026-10-05), which is the sensible behaviour.","The SRS Invoice Status \"Fully Credited\" needs Outstanding = 0, but with \"Update Outstanding for Self\" ticked by default (as the SRS asks) a return keeps its own outstanding and the original invoice keeps its outstanding: ACC-SINV-2026-02792, fully returned by two credit notes, shows Invoice Status Unpaid and Credit Status Fully Credited, never Fully Credited as an Invoice Status. Please confirm which one is wanted.","Other SRS wording problems: the Get Items popups say \"quotations ... To Pay / To Deliver\" (copy and paste; the system lists To Bill and Partially Billed documents), the More Info preconditions mention Sales Order, \"Source Invoice\" is described as the invoice of the Rate Adjustment Entry but named Return Against, the Hold popup button is named Submit, the quantity warning is described as \"less than the available quantity\" (inverted), Ordered Qty is described as Sales Orders and as Purchase Orders, Edit Row item filter says Maintain Stock while the table says Is Fixed Asset, Invoice Portion has a maximum of 3 and of 100 characters.","Submit runs at once with no confirmation (the SRS does not ask for one). A submitted invoice still accepts a new Customer PO number through the API (po_no is allowed after submit in this version); the screen is read-only after Submit."],"obsTitle":"Observations that need an SRS decision","rd":"How to read this report","rdBody":["Severity: Critical blocks a core flow with no workaround. High breaks an SRS rule that changes data or what the user can do. Medium is wrong behaviour with a workaround. Low is cosmetic or minor. Priority P1 to P4 is the suggested fix order. Layer says where the fix most likely lives; Backend and Frontend both appear when the evidence points to a contract mismatch between them.","Test names in the spec start with the test case ID from the Delivery Note sheet (TC-DNL, TC-DNA, TC-DNW, TC-DNG, TC-DNM, TC-DND), so a failing check maps straight back to the sheet."]},"ar":{"dir":"rtl","lang":"ar","btn":"English","title":"تقرير مقارنة Sales Invoice بالـ SRS","eyebrow":"تقرير مشاكل الجودة · Selling › Sales Invoice (مقارنة كاملة بالـ SRS)","h1":"Sales Invoice: 21 فرق جديد عن الـ SRS؛ والفاتورة بقت تتعمل وتتعتمد من الشاشة، لكن قسم نقاط الولاء ناقص","lede":"مقارنة كاملة لقايمة Sales Invoice وشاشة الإضافة (تابات Details وGeneral Information وMore Information) وشاشة التفاصيل بإجراءاتها (Submit وCancel Document وAmend وCreate وActions › UnReconcile وView وLinked Records) وقواعد السيرفر بالـ SRS (الصفحات 241 لـ 334) على السيرفر التجريبي: 98 فحص (77 مطابق و21 مختلف). الفاتورة الصحيحة بقت تتعمل وتتحفظ وتتعتمد من الشاشة الجديدة (ACC-SINV-2026-02789 وحالتها Unpaid)، والحالات والدفعات والمرتجعات الجزئية والكاملة ورفض التعديل وتاب Connections ماشيين زي الـ SRS. أهم فرق SI-12: قسم Loyalty Points Redemption (وعرض Loyalty Points) مش موجود في الشاشة، حتى لعميل عنده Loyalty Program. ومن النقط المهمة كمان إن Create › Return وCreate › Delivery Note بيحفظوا مستند على طول (SI-13) وبيدّوا المرتجع مستودع مجمّع (SI-14)، وإن Edit Row بيفتح دايما بخطأ «كود الصنف مطلوب» (SI-15)، وإن نوافذ Get Items From بتقف عند 50 مستند (SI-16). وتقرير Sales Invoice القديم (SI-01 لـ SI-11) اتراجع: خمس نقاط منه لسه مفتوحة وأربعة اتصلحوا؛ شوف «ملاحظات».","meta":[["البيئة","test.hr.azzrk.com"],["المتصفح","Chromium (كمبيوتر)"],["المستخدم","Administrator"],["الشركة","Ahmed Ebrahim CO."],["اللغة","واجهة عربي (لغة الحساب: ar)"],["تاريخ التشغيل","2026-11-18"],["الطريقة","فحوصات متصفح بـ Playwright ونداءات على endpoint الإنشاء والـ API العادي (لسه مش محفوظة كملف اختبار)"],["أرقام المشاكل","SI-12 لـ SI-32 (جديدة؛ وSI-01 لـ SI-11 في التقرير القديم)"]],"stats":["إجمالي المشاكل","حرجة","عالية","متوسطة","منخفضة","الإصلاح غالبًا في Backend","الإصلاح غالبًا في Frontend","تم إصلاحها أو إعادة اختبارها"],"cov":"تغطية الاختبار","covHead":["المنطقة","عدد الفحوصات الآلية","نجح","فيه عيب","لم يكتمل"],"covRows":[["شاشة القايمة: الأعمدة والحالات (Unpaid وPartially Paid وFully Paid وOverdue وReturn وFully Credited وDraft وCancelled) وحالتي Credit وRefund وشريط الإجراءات ورفض Edit الجماعي لفاتورة معتمدة",8,7,1,0],["شاشة الإضافة (تاب Details): الشركة والـ series والعميل والتواريخ والعلامات والعملة وقايمة الأسعار والباركود وجدول Items (إضافة وتعديل وحذف والمستودع وقواعد الكمية) وEdit Row وSetting وGet Items From (Sales Order وQuotation وDelivery Note) والضرايب والإجماليات وAdditional Discount وBundle Items",26,19,7,0],["تابات General Information وMore Information: الدفعات والباقي والـ advances والـ write off والولاء والعناوين وشروط الدفع والـ terms والحالة وتفاصيل المحاسبة وإعدادات الطباعة والمعلومات الإضافية",22,21,1,0],["شاشة التفاصيل والإجراءات: Save وSubmit وCancel Document وAmend وCreate (Return وDelivery Note وPayment وMaintenance Schedule) وActions › UnReconcile وView وCreate Quality Inspection وLinked Records وا   const t = L(), n = (f) => BUGS.filter(f).length;
  const st = $('#stats'); st.textContent = '';
  const add = (cls, num, label) => st.append(h('div', {class:'stat ' + cls}, h('span', {class:'n', text:String(num)}), h('span', {class:'l', text:label})));
  add('', BUGS.length, t.stats[0]); add('crit', n(b => b.sev === 'Critical'), t.stats[1]); add('high', n(b => b.sev === 'High'), t.stats[2]);
  add('med', n(b => b.sev === 'Medium'), t.stats[3]); add('low', n(b => b.sev === 'Low'), t.stats[4]);
  add('', n(b => b.layer === 'Backend'), t.stats[5]); add('', n(b => b.layer === 'Frontend'), t.stats[6]);
  add('ok', BUGS.filter(b => ['Fixed','Retest Passed'].includes(statusOf(b.id))).length, t.stats[7]);
}
function bugEl(b) {
  const t = L(), fb = feedback.get(b.id) || {}, st = statusOf(b.id);
  const d = h('details', {class:'bug', 'data-sev':b.sev, id:b.id});
  d.append(h('summary', {}, h('span', {class:'id', text:b.id}), h('span', {class:'t', text:textOf(b, 'title')}),
    h('span', {class:'chip st ' + st.replace(/ /g,''), text:t.status[st]}),
    h('span', {class:'chips'}, h('span', {class:'chip ' + b.sev, text:t.sev[b.sev]}), h('span', {class:'chip', text:b.pri}),
      h('span', {class:'chip', text:b.layer + (b.also ? ' + ' + b.also : '')}), h('span', {class:'chip', text:textOf(b, 'area')}))));
  const body = h('div', {class:'body'});
  const tcs = b.tc.map(x => (LANG === 'ar' && TC_AR[x]) || x).join(' · ');
  body.append(h('div', {class:'grid2'}, field(t.f.tc, h('p', {class:'mono ltr', text:tcs})), field(t.f.srs, h('p', {text:t.srsPrefix + ': ' + textOf(b, 'srs')}))));
  body.append(field(t.f.steps, h('ol', {}, textOf(b, 'steps').map(s => h('li', {text:s})))));
  body.append(h('div', {class:'grid2'}, field(t.f.exp, h('p', {text:textOf(b, 'expected')})), field(t.f.act, h('p', {text:textOf(b, 'actual')}))));
  if (b.code) body.append(field(t.f.code, h('pre', {class:'ltr', text:b.code})));
  if (b.shots) body.append(field(t.f.shots, h('div', {class:'shots'}, b.shots.map(([k, cap]) => SHOTS[k] ? h('figure', {}, h('img', {src:SHOTS[k], alt:cap, loading:'lazy'}), h('figcaption', {text: LANG === 'ar' && SHOT_AR[k] ? SHOT_AR[k] : cap})) : null))));
  if (b.fix) body.append(field(t.f.fix, h('p', {text:textOf(b, 'fix')})));
  const sel = h('select', {id:'st-' + b.id}, STATUSES.map(s => h('option', {value:s, text:t.status[s]}))); sel.value = st;
  const who_ = h('input', {type:'text', id:'as-' + b.id, placeholder:t.fb.devName}); who_.value = fb.assignee || '';
  const ver = h('input', {type:'text', id:'vr-' + b.id, placeholder:t.fb.buildPh}); ver.value = fb.build || '';
  const cm = h('textarea', {id:'cm-' + b.id, placeholder:t.fb.cmPh}); cm.value = fb.comment || '';
  const save = h('button', {class:'primary', type:'button', text:t.fb.save});
  const msg = h('span', {class:'last', text: fb.updatedAt ? t.fb.last + ' ' + new Date(fb.updatedAt).toLocaleString(LANG === 'ar' ? 'ar-EG' : undefined) + (fb.by ? ' ' + t.fb.by + ' ' + fb.by : '') : t.fb.none});
  const dis = !dbRef || !canWrite;
  [sel, who_, ver, cm, save].forEach(x => x.disabled = dis);
  save.addEventListener('click', async () => {
    save.disabled = true; msg.textContent = t.fb.saving;
    try { await dbRef.collection('bugs').doc(b.id).set({ status:sel.value, assignee:who_.value.trim(), build:ver.value.trim(), comment:cm.value.trim(), by:who, updatedAt:new Date().toISOString() }); }
    catch (e) { msg.textContent = t.fb.err; save.disabled = false; }
  });
  body.append(h('div', {class:'fb'}, h('span', {class:'eyebrow', text:t.fb.title}),
    h('div', {class:'row'}, h('label', {}, t.fb.status, sel), h('label', {}, t.fb.as, who_), h('label', {}, t.fb.build, ver)),
    h('label', {}, t.fb.cm, cm), h('div', {class:'row'}, save, msg),
    h('span', {class:'note', text: dbRef ? (canWrite ? t.fb.ok : t.fb.ro) : t.fb.na})));
  d.append(body); return d;
}
function visible(b) {
  const q = $('#q').value.trim().toLowerCase(), sev = $('#fSev').value, layer = $('#fLayer').value, st = $('#fStatus').value;
  if (sev && b.sev !== sev) return false;
  if (layer && b.layer !== layer && b.also !== layer) return false;
  if (st && statusOf(b.id) !== st) return false;
  if (q && !(b.id + ' ' + b.title + ' ' + (BUG_AR[b.id] ? BUG_AR[b.id].t : '') + ' ' + b.tc.join(' ') + ' ' + b.area).toLowerCase().includes(q)) return false;
  return true;
}
function renderBugs() {
  const open = new Set([...document.querySelectorAll('details.bug[open]')].map(x => x.id));
  const focusId = document.activeElement && document.activeElement.id;
  const list = BUGS.filter(visible), wrap = $('#bugs'); wrap.textContent = '';
  for (const b of list) { const el = bugEl(b); if (open.has(b.id)) el.open = true; wrap.append(el); }
  if (!list.length) wrap.append(h('p', {class:'small', text:L().none}));
  $('#count').textContent = list.length + ' ' + L().of + ' ' + BUGS.length;
  if (focusId) { const f = document.getElementById(focusId); if (f) f.focus(); }
  renderStats();
}
function setLang(l) { LANG = l; try { localStorage.setItem('ps-report-lang', l); } catch (e) {} renderStatic(); renderBugs(); }
function init() {
  $('#langBtn').addEventListener('click', () => setLang(LANG === 'en' ? 'ar' : 'en'));
  ['q','fSev','fLayer','fStatus'].forEach(id => $('#' + id).addEventListener('input', renderBugs));
  document.addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG' && e.target.closest('figure')) {
      const lb = h('div', {class:'lightbox', role:'dialog', 'aria-label':'Screenshot'}, h('img', {src:e.target.src, alt:e.target.alt}));
      lb.addEventListener('click', () => lb.remove()); document.body.append(lb);
    }
  });
  renderStatic(); renderBugs();
  if (location.hash.length > 1) { const t = document.getElementById(location.hash.slice(1)); if (t && t.tagName === 'DETAILS') { t.open = true; t.scrollIntoView(); } }
}
init();
(async () => {
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db) return;
    dbRef = db;
    if (user) { try { const me = await user.me(); if (me && me.name) who = me.name; } catch (e) {} const w = user.can && user.can('data.write'); if (w === false) canWrite = false; }
    db.collection('bugs').onSnapshot((snap) => { feedback.clear(); snap.docs.forEach(d => feedback.set(d.id, d.data())); renderBugs(); }, () => { renderBugs(); });
    renderBugs();
  } catch (e) { /* feedback stays unavailable; the report still reads fine */ }
})();
</script>
