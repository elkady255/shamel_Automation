<title>Quotation Bug Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky filter bar over a single column of bug rows that expand in place; summary and coverage first. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #eef1f5; --fg: #17202b; --muted: #5b6776; --line: #d8dee6;
  --accent: #0b6e69; --accent-fg: #ffffff;
  --crit: #b4232c; --crit-bg: #fbe9ea; --high: #b5560a; --high-bg: #fdf0e2; --med: #8a6d00; --med-bg: #fbf4d9; --low: #3d6a8f; --low-bg: #e6eef6;
  --ok: #1f7a46; --ok-bg: #e4f4ea; --code-bg: #0f1722; --code-fg: #d7e2f0;
  --sans: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --surface: #151d27; --surface-2: #1c2632; --fg: #e5ebf2; --muted: #98a5b5; --line: #2a3644;
  --accent: #4cc2ba; --accent-fg: #07201e;
  --crit: #ff8b92; --crit-bg: #3a1a1e; --high: #ffb066; --high-bg: #3a2714; --med: #e9cd5b; --med-bg: #342d12; --low: #86b6e0; --low-bg: #172a3b;
  --ok: #6fd69b; --ok-bg: #143324; --code-bg: #0a1017; --code-fg: #d7e2f0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #151d27; --surface-2: #1c2632; --fg: #e5ebf2; --muted: #98a5b5; --line: #2a3644;
  --accent: #4cc2ba; --accent-fg: #07201e;
  --crit: #ff8b92; --crit-bg: #3a1a1e; --high: #ffb066; --high-bg: #3a2714; --med: #e9cd5b; --med-bg: #342d12; --low: #86b6e0; --low-bg: #172a3b;
  --ok: #6fd69b; --ok-bg: #143324; --code-bg: #0a1017; --code-fg: #d7e2f0; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); padding-inline: 16px; padding-block: 0 56px; }
.wrap { max-width: 1040px; margin-inline: auto; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: 1.7rem; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 600; }
.mono { font-family: var(--mono); }
.eyebrow { font: 500 0.72rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
header.top { padding-block: 32px 20px; display: grid; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 0.86rem; }
.meta b { color: var(--fg); font-weight: 500; }
.lede { max-width: 68ch; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-block: 8px 28px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; }
.stat .n { font: 600 1.7rem/1.1 var(--sans); font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 0.82rem; }
.stat.crit .n { color: var(--crit); } .stat.high .n { color: var(--high); } .stat.med .n { color: var(--med); } .stat.low .n { color: var(--low); } .stat.ok .n { color: var(--ok); }
section { margin-block: 0 36px; display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 0.72rem/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar input[type=search] { flex: 1 1 200px; min-width: 0; }
select, input, textarea, button { font: inherit; color: var(--fg); }
select, input[type=search], input[type=text], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
textarea { width: 100%; min-height: 78px; resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
button:disabled { opacity: 0.55; cursor: default; }
.count { color: var(--muted); font-size: 0.85rem; margin-inline-start: auto; }
.bugs { display: grid; gap: 10px; margin-top: 12px; }
details.bug { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; border-inline-start-width: 4px; }
details.bug[data-sev="Critical"] { border-inline-start-color: var(--crit); } details.bug[data-sev="High"] { border-inline-start-color: var(--high); }
details.bug[data-sev="Medium"] { border-inline-start-color: var(--med); } details.bug[data-sev="Low"] { border-inline-start-color: var(--low); }
summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary .id { font: 500 0.85rem var(--mono); }
summary .t { font-weight: 500; min-width: 0; }
summary .chips { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 0.72rem/1 var(--mono); padding: 4px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.Critical { background: var(--crit-bg); color: var(--crit); } .chip.High { background: var(--high-bg); color: var(--high); }
.chip.Medium { background: var(--med-bg); color: var(--med); } .chip.Low { background: var(--low-bg); color: var(--low); }
.chip.st { background: var(--surface-2); color: var(--fg); }
.chip.st.Fixed, .chip.st.RetestPassed { background: var(--ok-bg); color: var(--ok); }
.chip.st.Reopened { background: var(--crit-bg); color: var(--crit); }
.body { padding: 4px 16px 16px; display: grid; gap: 16px; border-top: 1px solid var(--line); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.field > .eyebrow { display: block; margin-bottom: 5px; }
.field p, .field ol, .field ul { margin: 0; } .field ol, .field ul { padding-inline-start: 20px; }
.field li { margin-block: 2px; }
pre { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 6px; padding: 11px 13px; font: 0.8rem/1.5 var(--mono); overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
figure img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; display: block; }
figcaption { color: var(--muted); font-size: 0.8rem; }
.fb { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; }
.fb .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.fb label { display: grid; gap: 4px; font-size: 0.82rem; color: var(--muted); }
.fb .note { font-size: 0.8rem; color: var(--muted); }
.fb .last { font-size: 0.8rem; color: var(--muted); }
.pass { color: var(--ok); font-weight: 500; } .fail { color: var(--crit); font-weight: 500; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: grid; place-items: center; z-index: 20; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
.small { color: var(--muted); font-size: 0.85rem; }
@media (max-width: 560px) { summary { grid-template-columns: 1fr; } summary .chips { grid-column: 1; } h1 { font-size: 1.4rem; } }
@media (prefers-reduced-motion: no-preference) { details.bug { transition: border-color .15s; } }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lang { font-weight: 500; }
.ltr { direction: ltr; unicode-bidi: isolate; }
pre.ltr { text-align: left; }
.sp { display: block; margin-top: 10px; }
</style>

<div class="wrap" id="wrap">
  <header class="top">
    <div class="topline"><span class="eyebrow" id="eyebrow"></span><button type="button" id="langBtn" class="lang" aria-label="Language"></button></div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="meta" id="meta"></div>
  </header>
  <div class="stats" id="stats"></div>
  <section aria-labelledby="cov"><h2 id="cov"></h2><div id="covBody" style="display:grid;gap:12px"></div></section>
  <section aria-labelledby="bl">
    <h2 id="bl"></h2>
    <div class="bar" role="search">
      <input type="search" id="q" aria-label="Search">

  <section aria-labelledby="ob"><h2 id="ob"></h2><div class="panel field"><ul id="obs"></ul></div></section>
  <section aria-labelledby="rd"><h2 id="rd"></h2><div class="panel field small" id="rdBody"></div></section>
</div>

<script>
const SHOTS = {};
const STATUSES = ['New','In Progress','Fixed','Retest Passed','Reopened','Not a Bug','Cannot Reproduce','Deferred'];
const BUGS = [
 {
  "id": "QT-01",
  "sev": "High",
  "pri": "P1",
  "layer": "Frontend",
  "title": "A Quotation cannot be saved from the Add screen: two mandatory fields (Employee and Name In Contract) are not on the form",
  "area": "Add Quotation › Save",
  "tc": [],
  "srs": "Save: if all required data is entered correctly and completely, the Quotation is saved as Draft",
  "steps": [
   "Open Selling › Quotations › Add Quotation.",
   "Choose the customer \"PW Test Customer\", add the item IND182210 with Quantity 2.5 (every field the screen marks as mandatory is filled).",
   "Click Save."
  ],
  "expected": "The Quotation is saved as a Draft and appears in the list.",
  "actual": "The save fails with \"Error: Value missing for Quotation: Name In Contract\" and \"Value missing for Quotation: Employee\". The Quotation doctype has two custom mandatory fields, Employee (custom_employee) and Name In Contract (custom_name_in_contract), and no tab of the screen shows them, so the user cannot fill them. The same data saved through the create endpoint works as soon as the two values are sent (SAL-QTN-2026-01657 and the others). The other custom fields (Department, Pricing Request, Opportunity) are also not on the screen.",
  "code": "Add Quotation (customer + 1 item) -> Save -> \"Value missing for Quotation: Name In Contract / Employee\"\nPOST Quotation + custom_employee=\"HR-EMP-01418\", custom_name_in_contract=\"PW QT\" -> saved",
  "shots": [],
  "fix": "Show the Employee and Name In Contract fields on the Details tab (or default them / make them optional), and decide what to do with the other custom fields. Until then no Quotation can be created from the new screen."
 },
 {
  "id": "QT-02",
  "sev": "Medium",
  "pri": "P3",
  "layer": "Frontend",
  "title": "Save gives no visible feedback: an untouched form does nothing, and a missing Customer shows only a small message at the top of the page",
  "area": "Add Quotation › Save",
  "tc": [],
  "srs": "If incorrect or incomplete data is entered, a validation error message is displayed for each invalid field",
  "steps": [
   "Open Add Quotation and click Save without typing anything.",
   "Then add only an item row (IND182210) and click Save again; the Save button is at the bottom of the page."
  ],
  "expected": "A message for each empty mandatory field, visible where the user is looking.",
  "actual": "The untouched form shows nothing at all (no message, no toast, no red field). With an item added, the only message is a small red \"الطرف مطلوب\" under the Customer box at the top of the page; there is no toast and the page does not scroll to it, so a user who clicked Save at the bottom sees nothing happen. Save on an unchanged Draft also shows nothing. Same behavior as CC-11, PL-04, IP-07, CG-05, TR-04, ST-06 and PR-07.",
  "code": "Add form untouched -> Save -> nothing\nAdd form + item, no customer -> Save -> inline \"الطرف مطلوب\" only (offscreen)",
  "shots": [],
  "fix": "Validate the whole form on Save even when it is not marked as changed, scroll to the first invalid field and show a toast."
 },
 {
  "id": "QT-03",
  "sev": "Medium",
  "pri": "P3",
  "layer": "Frontend",
  "title": "The Setting popup of the Items table lists no columns, and its \"Add / Remove Fields\" popup is empty",
  "area": "Add / Details › Items › Setting",
  "tc": [],
  "srs": "Setting popup: drag and drop of the columns, Column width (default 3), Add / Remove columns with the full column list, \"Update\" and \"Reset to default\" buttons",
  "steps": [
   "Open Add Quotation (or the saved Draft SAL-QTN-2026-01655) and click the gear above the Items table.",
   "Click \"Add/Remove Fields\"."
  ],
  "expected": "The columns of the table with their width, the list of all available columns with checkboxes, Update and Reset to default.",
  "actual": "\"Edit Columns\" shows only the two headings \"Field Name\" and \"Column Width\" with no rows, and \"Add/Remove Fields\" opens an \"Available fields\" popup with no fields (only Cancel and Add). The buttons are Cancel and Save; there is no Reset to default (same as AD-11, CT-16, ST-08 and PR-10). Only the Items table was checked; the Taxes table has the same gear.",
  "code": "gear -> Edit Columns: Field Name | Column Width | Add/Remove Fields | Cancel | Save (no rows)\nAdd/Remove Fields -> Available fields (empty) | Cancel | Add",
  "shots": [],
  "fix": "Load the column list of the child doctype into the popup, and add Reset to default and the \"Update\" label."
 },
 {
  "id": "QT-04",
  "sev": "Medium",
  "pri": "P2",
  "layer": "Frontend",
  "title": "The \"Get Items From Opportunity\" action does not exist",
  "area": "Add Quotation / Details › Fixed Page Actions",
  "tc": [],
  "srs": "Get Items From Opportunity: a popup with search by Name, Party and Opportunity Type, a list of Opportunities with status Open or Quotation, and a \"Get Items\" button that adds the items to the table",
  "steps": [
   "Open Add Quotation and read the buttons of the page.",
   "Open a Draft and a submitted Quotation and read the buttons again."
  ],
  "expected": "A \"Get Items From Opportunity\" button in the page actions.",
  "actual": "Add Quotation has only Cancel and Save; a Draft has Cancel, Save and Submit; a submitted Quotation has Cancel Document, Set as Lost, Update Items and Create. The action is not anywhere. (The Linked Records tab does list Opportunities.)",
  "code": "Add: Cancel | Save    Draft: Cancel | Save | Submit    Submitted: Cancel Document | Set as Lost | Update Items | Create",
  "shots": [],
  "fix": "Add the action and its popup, or remove it from the SRS if the Opportunity flow is out of scope."
 },
 {
  "id": "QT-05",
  "sev": "Medium",
  "pri": "P2",
  "layer": "Frontend",
  "title": "Create › Sales Order and Create › Sales Invoice do not open the new document",
  "area": "Quotation Details › Create",
  "tc": [],
  "srs": "Create › Sales Order / Sales Invoice: navigates to the Add Sales Order / Add Sales Invoice screen and the items are fetched from the Quotation",
  "steps": [
   "Open the submitted Quotation SAL-QTN-2026-01674 (status Open).",
   "Click Create, then Sales Order. Repeat with Sales Invoice."
  ],
  "expected": "The Add Sales Order (Add Sales Invoice) screen opens with the Quotation items.",
  "actual": "The page stays on the Quotation and a toast says \"Sales Order Prepared from this quotation with 1 item(s). The screen for it is not part of this release yet.\" (the same for Sales Invoice). The sidebar already has \"Sales Orders\" and \"Sales Invoices\".",
  "code": "Create -> Sales Order  -> toast \"...The screen for it is not part of this release yet.\"",
  "shots": [],
  "fix": "Open the Add screens with the prepared items, or hide the two actions until the screens are linked."
 },
 {
  "id": "QT-06",
  "sev": "Medium",
  "pri": "P3",
  "layer": "Frontend",
  "title": "After Amend the screen keeps showing the Cancelled Quotation",
  "area": "Quotation Details › Amend",
  "tc": [],
  "srs": "Amend: appears only when the status is Cancelled; the amended Quotation is created as a new Draft with \"Amended From\"",
  "steps": [
   "Open a submitted Quotation, click Cancel Document, then click Amend.",
   "Look at the screen after the toast."
  ],
  "expected": "The new Draft (SAL-QTN-2026-01674-1) opens with Save and Submit.",
  "actual": "The address becomes ...01674-1 and the toast \"Quotation amended successfully\" shows, but the page still shows the old document: status Cancelled and only the Amend button. The new Draft is correct after a reload (status Draft, \"Amended From\" = SAL-QTN-2026-01674, Cancel / Save / Submit).",
  "code": "Amend -> URL .../SAL-QTN-2026-01674-1, screen still \"Cancelled\" + [Amend]",
  "shots": [],
  "fix": "Reload the document data when the route changes after Amend."
 },
 {
  "id": "QT-07",
  "sev": "Medium",
  "pri": "P3",
  "layer": "Frontend",
  "title": "The Address labels (Billing, Shipping and Company) always show \"—\"",
  "area": "Add / Details › General Information › Addresses",
  "tc": [],
  "srs": "Address: read-only label that displays the address description, city / town, state and country of the selected address",
  "steps": [
   "Open Add Quotation, choose the customer \"PW Test Customer\" and open General Information.",
   "Or open the saved Draft SAL-QTN-2026-01655 and open General Information."
  ],
  "expected": "The text of the address under \"Address\", \"Shipping Address\" and \"Company Address\".",
  "actual": "The address name is filled automatically (billing and shipping \"PW AD P2 176481\", company \"54-Billing\"), but the three read-only labels show \"—\". The saved Quotation already has the text in its address_display field. The automatic choice of the customer address follows the SRS (the primary address \"PW AD P2 176481\" is chosen).",
  "code": "Customer Address Name = \"PW AD P2 176481\" -> Address = \"—\"",
  "shots": [],
  "fix": "Fill the three labels from the selected address (and refresh them when the address changes)."
 },
 {
  "id": "QT-08",
  "sev": "Medium",
  "pri": "P3",
  "layer": "Backend",
  "title": "The server saves a Quotation with no Party, and a row with Quantity 0 while \"Has Unit Price Items\" is off",
  "area": "Add Quotation › Party and Items › Qty",
  "tc": [],
  "srs": "Party: mandatory. Qty: if Has Unit Price Items is unchecked, Qty must be greater than 0",
  "steps": [
   "Send the create request with no party_name (everything else valid).",
   "Send it with an item row of qty 0 and has_unit_price_items = 0."
  ],
  "expected": "Both are refused.",
  "actual": "Both are saved as Drafts (SAL-QTN-2026-01659 and SAL-QTN-2026-01675, total 0). The screen refuses both (\"الطرف مطلوب\" and \"Row 1: Quantity must be greater than 0\"), so only the server rules are missing. A negative quantity is refused with the technical text \"Incorrect value: Grand Total (Company Currency) must be >= 0.0\".",
  "code": "Quotation  party_name=<empty>  -> saved\nQuotation  items[0].qty=0, has_unit_price_items=0  -> saved, grand_total 0",
  "shots": [],
  "fix": "Add the two rules to the server validation and a clear message for a negative quantity."
 },
 {
  "id": "QT-09",
  "sev": "Medium",
  "pri": "P3",
  "layer": "Backend",
  "title": "The server accepts a UOM the item does not have, a row without a Warehouse and a Warehouse of another company",

  ],
  "expected": "All three are refused.",
  "actual": "All three are saved (SAL-QTN-2026-01681, 01682 and 01683). The Edit Row popup marks Warehouse as mandatory and lists only the item UOMs. A missing UOM is refused (\"Value missing for: UOM\").",
  "code": "items[0].uom=\"Kg\" -> saved\nitems[0].warehouse=<none> -> saved\nitems[0].warehouse=\"Stores - Warrqa\" (company Ahmed Ebrahim CO.) -> saved",
  "shots": [],
  "fix": "Check that the UOM belongs to the item, make Warehouse mandatory and check that it belongs to the company."
 },
 {
  "id": "QT-10",
  "sev": "Medium",
  "pri": "P3",
  "layer": "Backend",
  "title": "A negative Additional Discount (percentage or amount) is accepted and raises the total",
  "area": "Additional Discount",
  "tc": [],
  "srs": "Additional Discount Percentage and Amount: numbers only (a discount reduces the total)",
  "steps": [
   "Send the create request with additional_discount_percentage = -10 on a quotation of 20,400.",
   "Send another with discount_amount = -50."

  "expected": "Both are refused.",

  "code": "additional_discount_percentage=-10 -> grand_total 22,440\ndiscount_amount=-50 -> grand_total 20,450",
  "shots": [],
  "fix": "Refuse a negative additional discount (percentage and amount)."
 },
 {
  "id": "QT-11",
  "sev": "Medium",
  "pri": "P3",
  "layer": "Backend",
  "title": "Tax rows with a negative rate or a rate of 500%, and an \"Actual\" row with no amount, are accepted",

  "srs": "Tax Rate: optional, numbers only; Type: mandatory",
  "steps": [

  "expected": "A negative rate and an impossible rate are refused; an Actual row without an amount is refused.",
  "actual": "All are saved: -5% lowers the grand total to 19,380 (SAL-QTN-2026-01701), 500% raises it to 122,400 (SAL-QTN-2026-01702) and the Actual row is saved with 0 (SAL-QTN-2026-01703). A row without an Account Head, and \"On Previous Row Amount\" on the first row, are refused correctly.",
  "code": "taxes[0] On Net Total rate=-5 -> grand 19,380\ntaxes[0] On Net Total rate=500 -> grand 122,400",
  "shots": [],
  "fix": "Validate the tax rate (not negative) and the amount of an Actual row."
 },
 {
  "id": "QT-12",
  "sev": "Medium",

const T = {"en":{"dir":"ltr","lang":"en","btn":"عربي","title":"Quotation Bug Report","eyebrow":"QA bug report · Selling › Quotation","h1":"Quotation: 23 differences from the SRS, and a new Quotation cannot be saved from the screen","lede":"Comparison of the Quotation list, the Add screen (Details, General Information and More Information tabs), the Details screen with its actions (Submit, Cancel, Amend, Set as Lost, Update Items, Create, Auto Repeat, Linked Records) and the server rules with the SRS (pages 110 to 168), on the test server: 66 checks (43 matched, 23 differ). The most important finding is QT-01: the Quotation doctype has two mandatory custom fields, Employee and Name In Contract, that the new screen does not show, so saving a Quotation from the Add screen fails even when every visible field is filled. Because of it, the Draft, submit, cancel, amend and Set as Lost checks were run on Quotations created through the create endpoint (with the two values) and then driven on the screen. The rest of the screen follows the SRS closely: the list and its action bar (this is the first module where Clear Assignment is present), the defaults (Customer, today, Valid Till = Date + the 2 days of the CRM setting, SAR, Standard Selling), the Customer / Lead choice, the address selection rules, the Set as Lost, Update Items, Create and Auto Repeat popups and the Linked Records tab. The other gaps are the empty Setting popup (QT-03), the missing \"Get Items From Opportunity\" action (QT-04), Create › Sales Order / Sales Invoice that do not open the documents (QT-05), the address labels that show \"—\" (QT-07), and a group of server rules that the screen has but the server does not (QT-08 to QT-13).","meta":[["Environment","test.hr.azzrk.com"],["Browser","Chromium (desktop)"],["User","Administrator"],["Company","Ahmed Ebrahim CO."],["Language","English at the start; Arabic after the account language changed to Arabic during the run"],["Run date","2026-11-17"],["Method","Pl signment, Print, Submit (Draft) or Cancel (submitted) and Delete","List Edit popup: a mandatory Field list with the Quotation fields and an Update button; on a Cancelled Quotation it refuses with \"لا يمكن تعديل عرض سعر تم تقديمه أو إلغاؤه\"","Add, basic information: Series (mandatory, SAL-QTN-.YYYY.-); Quotation To = Customer or Lead (the Party list and the Party Name follow it, and the Party is cleared when it changes); Date = today and the picker works; Valid Till = Date + 2 days (the CRM setting) and follows a new Date; Order Type is hidden; Has Unit Price Items is shown because Selling Settings allows zero quantity; Company is the default company; Currency SAR, Exchange Rate 1 and Price List \"Standard Selling\" with its read-only currency; Ignore Pricing Rule; Barcode stops at 100 characters","Items: Add Item, Item Code, Quantity, Rate and Amount; the item list leaves out template items and items with Allow Sales off; a quantity of 0 or less is refused on the screen (\"Row 1: Quantity must be greater than 0\"); a quantity above the available stock shows a warning; the Edit Row popup has Item, Item Group, Item Name, Customer's Item Code, Is Free Item, Is Alternative, Description, Brand, Qty, UOM, Stock UOM, Conversion Factor, the available quantities, price and margin fields, discounts, tax template, weights, Warehouse (mandatory), Blanket Order, Projected Qty and Shopping Cart","Taxes and Charges: Add Tax or Charge with Type (Actual, On Net Total, On Previous Row Amount, On Previous Row Total, On Item Quantity), Account Head, Tax Rate, Net Amount, Amount and Total; Totals in the selected and company currency; Additional Discount with Apply On, percentage, amount, Coupon Code and Referral Sales Partner","General Information: the customer billing and shipping address is the primary address, the company address is filled, the contact boxes show \"No contact selected\" when empty, Payment Schedule has Payment Term, Due Date, Invoice Portion, Payment Amount and Description, Terms stops at 500 characters; More Information: Status, Territory, Letter Head, Language, Print without Amount, Group same items; the Lost Reasons section with Lost Reason, Competitors and Detailed Reason appears when the status is Lost","Details: a Draft shows Save and Submit; Submit gives \"Quotation submitted successfully\" and the status Open with Cancel Document, Set as Lost, Update Items and Create; the fields become read-only; Cancel Document gives status Cancelled with only Amend; Amend creates a Draft with \"Amended From\"; the delete confirmation (Cancel closes it); the Linked Records tab with Sales Order, Sales Invoices, Opportunities and Auto Repeat","Popups: Set as Lost (Lost Reasons mandatory with the inline message \"Lost Reason is required\", Competitors, Detailed Reason stops at 100, Declare Lost sets the status Lost and shows \"Quotation set as Lost\"); Update Items (Item Code, Quantity, Rate, UOM, Add Item, Update); Auto Repeat (Frequency mandatory, Start Date today, End Date); the Create menu has Sales Order, Sales Invoice and Auto Repeat","Server: a party that does not exist, a party of the wrong type, Valid Till before the Date, a date outside the fiscal year, a price list that does not exist, a template item, an item with Allow Sales off, an additional discount above the total, a payment due date before the posting date, a payment schedule that does not add to the total, a tax row without Account Head, \"On Previous Row Amount\" on the first row, a missing Employee or Name In Contract and an unknown Order Type are refused"],"noTitle":"Not executed, and why","no":["Saving a new Quotation from the screen (blocked by QT-01) and editing a Draft and clicking Save with changed data; Save, edit and Submit were run through the create endpoint and the screen buttons only","Delete \"Yes\" and the warnings for a Quotation that is amended or linked to other documents (Delete was not confirmed on any record)","The Exchange Rate rules of Accounts Settings (fetching rule, no rate found, the role that edits the rate); the Shipping Rule and the Sales Taxes and Charges Template filling the table; the Payment Terms Template filling the schedule; the Terms template filling the content; the contact selection rules (Preferred Billing Contact, Primary, latest), because the test customer has no contact","Bundle Items and Pricing Rule Detail with a Product Bundle item or a Pricing Rule; batch and serial fields; Blanket Order; Has Unit Price Items on the screen; the Valid Till message when it is before the Date on the screen (the server refuses it)","Column width, drag and drop and Add / Remove columns of the tables (the Setting popup is empty, QT-03); Export, Assign, tags, Print and Share; the Auto Repeat Save message; Get Items From Opportunity (the action is missing, QT-04); the automatic Expired status","The result of the Create › Sales Order and Create › Sales Invoice documents (the screens do not open, QT-05)"],"bugs":"Bugs","search":"Search id, title, test case","allSev":"All severities","allLayer":"Backend and Frontend","allStatus":"All statuses","of":"of","sev":{"Critical":"Critical","High":"High","Medium":"Medium","Low":"Low"},"status":{"New":"New","In Progress":"In Progress","Fixed":"Fixed","Retest Passed":"Retest Passed","Reopened":"Reopened","Not a Bug":"Not a Bug","Cannot Reproduce":"Cannot Reproduce","Deferred":"Deferred"},"f":{"tc":"Test case","srs":"SRS reference","steps":"Steps to reproduce","exp":"Expected result","act":"Actual result","code":"Backend evidence (request and response)","shots":"Screenshots","fix":"Suggested fix"},"srsPrefix":"Selling SRS v1.0, Quotation","fb":{"title":"Developer feedback","status":"Status","as":"Assigned to","build":"Build","cm":"Comment","save":"Save feedback","devName":"Developer name","buildPh":"Fixed in build / commit","cmPh":"Root cause, fix notes, or questions for the tester","last":"Last update","by":"by","none":"No feedback yet","saving":"Saving…","err":"Could not save. Try again.","ok":"Saved for everyone who opens this report. The tester sees it and retests.","ro":"You can read feedback here. Ask the report owner for contributor access to write.","na":"Feedback storage is not available in this view."},"none":"No bugs match these filters.","rt":"Retest plan: where we stopped","rtBody":[["p","Round 1 is finished. Retesting starts when the developers mark QT-01 to QT-13 as Fixed here (or tell the tester). QT-01 comes first, because the screen tests of the Add flow cannot start before a Quotation can be saved."],["h","When a fix lands"],["ol",["Repeat QT-01 on the screen first, then the Save, edit and Submit checks that were run through the create endpoint.","Repeat the server cases through the create endpoint (QT-08 to QT-13, QT-16, QT-18, QT-23) and the screen cases on the screen.","Run the cases listed under Not executed.","Update each bug status in the feedback box below."]],["h","Test data and records left in the system"],["p","The checks created 48 test Quotations (titles \"PW QT ...\"): SAL-QTN-2026-01657 to SAL-QTN-2026-01703 and the amended Draft SAL-QTN-2026-01674-1. SAL-QTN-2026-01674 is Cancelled, SAL-QTN-2026-01677 is Lost and SAL-QTN-2026-01703 is submitted (Open); the others are Drafts. One Item Price was created as a side effect (item 2121, Standard Selling, 100, id v09jn3ug67, see QT-23). Nothing was deleted. The existing Quotations were only read; SAL-QTN-2026-01655 and SAL-QTN-2026-01656 were opened without changes."]],"obs":["The SRS says a warning appears when the quantity is LESS than the available quantity; the system warns when the quantity is MORE than the available quantity (\"Row 1: quantity 2.0 for item IND182210 is more than the quantity available (-398.0) in warehouse Stores - E\"). The SRS wording looks inverted, please confirm.","The Delete rule in the SRS contradicts itself: the list says Delete appears only for Draft or Cancelled, the Details screen says only for Submitted. The system shows Delete (the bin icon) for Draft, submitted and Cancelled Quotations alike.","Copy and paste errors in the SRS: Use case 5 says \"view / edit the Delivery Note details\", the More Info Status says \"It displays the Delivery Note status\", and the Get Items popup says \"search by the sales order name\".","Submit and Cancel Document run at once with no confirmation (the SRS does not ask for one). A Lost Quotation still shows Cancel Document, Set as Lost, Update Items and Create.","The SRS says the default Price List is \"Standard Price List\"; the Selling Settings of this server set \"Standard Selling\". Selling Settings also has \"Validate selling price\" on, so a rate below the valuation rate is refused (\"Selling rate ... is lower than its valuation rate\"); the SRS does not mention this rule.","The SRS says the Auto Repeat Save shows \"Auto Repeat created successfully for this document\"; the Save was not clicked to avoid creating Auto Repeat records.","The Quotation list now holds more than 8,000 records and grows while the tests run (7,963 at the start, 8,011 later), so other users are creating Quotations on this server.","The Administrator account language changed from English to Arabic at about 12:29 during the run; the later checks were run on the Arabic screens. The screens and the data matched in both languages."],"obsTitle":"Observations that need an SRS decision","rd":"How to read this report","rdBody":["Severity: Critical blocks a core flow with no workaround. High breaks an SRS rule that changes data or what the user can do. Medium is wrong behaviour with a workaround. Low is cosmetic or minor. Priority P1 to P4 is the suggested fix order. Layer says where the fix most likely lives; Backend and Frontend both appear when the evidence points to a contract mismatch between them.","Test names in the spec start with the test case ID from the Delivery Note sheet (TC-DNL, TC-DNA, TC-DNW, TC-DNG, TC-DNM, TC-DND), so a failing check maps straight back to the sheet."]},"ar":{"dir":"rtl","lang":"ar","btn":"English","title":"تقرير مشاكل Quotation","eyebrow":"تقرير مشاكل الجودة · Selling › Quotation","h1":"Quotation: 23 فرق عن الـ SRS، ومينفعش تحفظ Quotation جديدة من الشاشة","lede":"مقارنة قايمة Quotation وشاشة الإضافة (تابات Details وGeneral Information وMore Information) وشاشة التفاصيل بإجراءاتها (Submit وCancel وAmend وSet as Lost وUpdate Items وCreate وAuto Repeat وLinked Records) وقواعد السيرفر بالـ SRS (الصفحات 110 لـ 168) على السيرفر التجريبي: 66 فحص (43 مطابق و23 مختلف). أهم نتيجة QT-01: الـ doctype فيه حقلين custom إجباريين، Employee وName In Contract، والشاشة الجديدة مبتعرضهمش، فحفظ Quotation من شاشة الإضافة بيفشل حتى لو كل الحقول الظاهرة مليانة. وعشان كده فحوصات الـ Draft والـ submit والـ cancel والـ amend والـ Set as Lost اتعملت على Quotations اتعملت بنداء الإنشاء (بالقيمتين) وبعدين اتشغلت من الشاشة. باقي الشاشة ماشي قريب من الـ SRS: القايمة وشريط إجراءاتها (ودي أول مرة Clear Assignment يبقى موجود في موديول)، والقيم الافتراضية (Customer والنهارده وValid Till = التاريخ + يومين من إعداد CRM وSAR وStandard Selling)، واختيار Customer / Lead، وقواعد اختيار العنوان، ونوافذ Set as Lost وUpdate Items وCreate وAuto Repeat وتاب Linked Records. الفروق التانية: نافذة Setting الفاضية (QT-03)، وإجراء «Get Items From Opportunity» الناقص (QT-04)، وCreate › Sales Order / Sales Invoice اللي مبيفتحوش المستندات (QT-05)، وعناوين Address اللي بتظهر «—» (QT-07)، ومجموعة قواعد سيرفر موجودة في الشاشة وناقصة في السيرفر (QT-08 لـ QT-13).","meta":[["البيئة","test.hr.azzrk.com"],["المتصفح","Chromium (كمبيوتر)"],["المستخدم","Administrator"],["الشركة","Ahmed Ebrahim CO."],["اللغة","إنجليزي في الأول؛ وعربي بعد ما لغة الحساب اتغيّرت لعربي أثناء الفحص"],["تاريخ التشغيل","2026-11-17"],["الطريقة","فحوصات متصفح بـ Playwright ونداءات على endpoint الإنشاء (لسه مش محفوظة كملف اختبار)"],["أرقام المشاكل","QT-01 لـ QT-23 (الموديول ده بس)"]],"stats":["إجمالي المشاكل","حرجة","عالية","متوسطة","منخفضة","الإصلاح غالبًا في Backend","الإصلاح غالبًا في Frontend","تم إصلاحها أو إعادة اختبارها"],"cov":"تغطية الاختبار","covHead":["المنطقة","عدد الفحوصات الآلية","نجح","فيه عيب","لم يكتمل"],"covRows":[["شاشة القايمة: الأعمدة والحالات وزر الإضافة وشريط الإجراءات (Edit وExport وAssign وAdd Tags وClear Assignment وPrint وSubmit / Cancel وDelete) ونافذة Edit ورفضها للـ Quotations المعتمدة والملغية",6,6,0,0],["شاشة الإضافة (تاب Details): Series وQuotation To وParty وParty Name وDate وValid Till وOrder Type المخفي وHas Unit Price Items وCompany وCurrency وExchange Rate وPrice List وIgnore Pricing Rule وBarcode وجدول Items وEdit Row وSetting وفلتر الأصناف وقواعد الكمية وTaxes and Charges وTotals وAdditional Discount والأقسام الفاضية ورسائل Save وSave ببيانات صحيحة وGet Items From Opportunity",25,16,9,0],["تابات General Information وMore Information: اختيار العناوين وعرضها وعنوان الشركة وPayment Schedule وTerms وStatus وTerritory وPrint Settings وLost Reasons والتسميات",8,6,2,0],["شاشة التفاصيل والإجراءات: Submit وCancel Document وAmend وتأكيد الحذف وSet as Lost وUpdate Items وAuto Repeat وقايمة Create وتنقلها وLinked Records والـ read-only بعد Submit",14,10,4,0],["قواعد السيرفر (إنشاء): الطرف والكمية وUOM والمستودع والخصومات والضرائب وأسعار الصرف وفلتر الأصناف وأطوال النصوص وأخطاء 500 والرفض وأثر Item Price",13,5,8,0]],"total":"الإجمالي","covNote":"لسه مفيش شيت test cases لـ Quotation، فالمشاكل فوق مش مربوطة بأرقام حالات. الفحوصات اتعملت بسكريبتات متصفح وطلبات للسيرفر.","okTitle":"اللي اتأكدنا إنه شغال","ok":["القايمة: أعمدة ID وStatus وCustomer Name وDate وCompany وGrand Total؛ وحالات Draft وOpen وExpired وCancelled وLost؛ وزر Add Quotation؛ وشريط الإجراءات فيه تحديد الكل وتعديل وتصدير واسناد وإضافة وسوم وClear Assignment وطباعة وتقديم (للـ Draft) أو إلغاء (للمعتمدة) وحذف","نافذة Edit في القايمة: قايمة Field إجبارية فيها حقول Quotation وزر تحديث؛ وعلى Quotation ملغية بترفض بـ «لا يمكن تعديل عرض سعر تم تقديمه أو إلغاؤه»","الإضافة، المعلومات الأساسية: Series (إجباري، SAL-QTN-.YYYY.-)؛ وQuotation To = Customer أو Lead (وقايمة Party وParty Name بيتبعوه، والـ Party بتتفضى لما يتغير)؛ وDate = النهارده والـ picker شغال؛ وValid Till = التاريخ + يومين (إعداد CRM) وبيتبع التاريخ الجديد؛ وOrder Type مخفي؛ وHas Unit Price Items ظاهر لأن Selling Settings بيسمح بكمية صفر؛ وCompany هي الشركة الافتراضية؛ وCurrency SAR وExchange Rate 1 وPrice List «Standard Selling» وعملتها للقراءة بس؛ وIgnore Pricing Rule؛ وBarcode بيقف عند 100 حرف","الأصناف: Add Item وItem Code وQuantity وRate وAmount؛ وقايمة الأصناف بتستبعد أصناف الـ template والأصناف اللي Allow Sales مقفول فيها؛ والكمية 0 أو أقل بتترفض في الشاشة («Row 1: Quantity must be greater than 0»)؛ والكمية الأكبر من المتاح بتظهر تحذير؛ ونافذة Edit Row فيها Item وItem Group وItem Name وCustomer's Item Code وIs Free Item وIs Alternative وDescription وBrand وQty وUOM وStock UOM وConversion Factor والكميات المتاحة وحقول السعر والهامش والخصومات وقالب الضريبة والأوزان وWarehouse (إجباري) وBlanket Order وProjected Qty وShopping Cart","Taxes and Charges: Add Tax or Charge بـ Type (Actual وOn Net Total وOn Previous Row Amount وOn Previous Row Total وOn Item Quantity) وAccount Head وTax Rate وNet Amount وAmount وTotal؛ وTotals بالعملة المحددة وعملة الشركة؛ وAdditional Discount بـ Apply On والنسبة والمبلغ وCoupon Code وReferral Sales Partner","General Information: عنوان فوترة وشحن العميل هو العنوان الأساسي، وعنوان الشركة بيتملي، وخانات جهة الاتصال بتعرض «لم يتم اختيار جهة اتصال» لما تبقى فاضية، وPayment Schedule فيه Payment Term وDue Date وInvoice Portion وPayment Amount وDescription، وTerms بتقف عند 500 حرف؛ وMore Information: Status وTerritory وLetter Head وLanguage وPrint without Amount وGroup same items؛ وقسم Lost Reasons بـ Lost Reason وCompetitors وDetailed Reason بيظهر لما الحالة Lost","التفاصيل: الـ Draft فيه Save وSubmit؛ وSubmit بيدي «Quotation submitted successfully» والحالة Open وفيها Cancel Document وSet as Lost وUpdate Items وCreate؛ والحقول بتبقى للقراءة بس؛ وCancel Document بيدي الحالة Cancelled وAmend بس؛ وAmend بيعمل Draft فيها «Amended From»؛ وتأكيد الحذف (الإلغاء بيقفله)؛ وتاب Linked Records فيه Sales Order وSales Invoices وOpportunities وAuto Repeat","النوافذ: Set as Lost (Lost Reasons إجباري برسالة «Lost Reason is required»، وCompetitors، وDetailed Reason بتقف عند 100، وDeclare Lost بيغيّر الحالة لـ Lost ويظهر «Quotation set as Lost»)؛ وUpdate Items (Item Code وQuantity وRate وUOM وAdd Item وUpdate)؛ وAuto Repeat (Frequency إجباري وStart Date النهارده وEnd Date)؛ وقايمة Create فيها Sales Order وSales Invoice وAuto Repeat","السيرفر: طرف مش موجود وطرف من نوع غلط وValid Till قبل Date وتاريخ برا السنة المالية وقايمة أسعار مش موجودة وصنف template وصنف Allow Sales مقفول وخصم إضافي أكبر من الإجمالي وتاريخ استحقاق دفعة قبل تاريخ الترحيل وجدول دفعات مجموعه مش بيساوي الإجمالي وصف ضريبة من غير Account Head و«On Previous Row Amount» في الصف الأول وEmployee أو Name In Contract ناقص وOrder Type مش معروف، كلهم بيترفضوا"],"noTitle":"اللي ماتنفذش وليه","no":["حفظ Quotation جديدة من الشاشة (متوقف بـ QT-01) وتعديل Draft والضغط على Save ببيانات متغيّرة؛ والحفظ والتعديل والـ Submit اتعملوا بنداء الإنشاء وأزرار الشاشة بس","«Yes» في الحذف وتحذيرات Quotation معدّلة أو مرتبطة بمستندات تانية (ماأكدتش الحذف على أي سجل)","قواعد Exchange Rate في Accounts Settings (قاعدة الجلب وحالة عدم وجود سعر والـ role اللي يعدّل السعر)؛ وملء الجدول من Shipping Rule ومن Sales Taxes and Charges Template؛ وملء الجدول من Payment Terms Template؛ وملء المحتوى من قالب Terms؛ وقواعد اختيار جهة الاتصال (Preferred Billing وPrimary وآخر واحدة)، لأن عميل الاختبار ملوش جهة اتصال","Bundle Items وPricing Rule Detail مع صنف Product Bundle أو Pricing Rule؛ وحقول الـ batch والـ serial؛ وBlanket Order؛ وHas Unit Price Items في الشاشة؛ ورسالة Valid Till لما تكون قبل Date في الشاشة (السيرفر بيرفضها)","Column width وسحب الأعمدة وAdd / Remove columns للجداول (نافذة Setting فاضية، QT-03)؛ والتصدير والإسناد والوسوم والطباعة والمشاركة؛ ورسالة Save في Auto Repeat؛ وGet Items From Opportunity (الإجراء مش موجود، QT-04)؛ وحالة Expired التلقائية","نتيجة مستندات Create › Sales Order وCreate › Sales Invoice (الشاشتين مبتفتحش، QT-05)"],"bugs":"المشاكل","search":"ابحث بالرقم أو العنوان أو رقم الحالة","allSev":"كل درجات الخطورة","allLayer":"Backend وFrontend","allStatus":"كل الحالات","of":"من","sev":{"Critical":"حرجة","High":"عالية","Medium":"متوسطة","Low":"منخفضة"},"status":{"New":"جديدة","In Progress":"جاري العمل","Fixed":"تم الإصلاح","Retest Passed":"نجحت إعادة الاختبار","Reopened":"أُعيد فتحها","Not a Bug":"ليست مشكلة","Cannot Reproduce":"لا يمكن إعادة الإنتاج","Deferred":"مؤجلة"},"f":{"tc":"رقم حالة الاختبار","srs":"مرجع الـ SRS","steps":"خطوات إعادة الإنتاج","exp":"النتيجة المتوقعة","act":"النتيجة الفعلية","code":"دليل الباك إند (الطلب والرد)","shots":"لقطات الشاشة","fix":"الحل المقترح"},"srsPrefix":"Selling SRS v1.0, Quotation","fb":{"title":"رد المطور","status":"الحالة","as":"المسؤول","build":"الإصدار","cm":"تعليق","save":"حفظ الرد","devName":"اسم المطور","buildPh":"اتصلحت في إصدار / commit","cmPh":"سبب المشكلة، أو ملاحظات الإصلاح، أو أسئلة للتيستر","last":"آخر تحديث","by":"بواسطة","none":"لا يوجد رد بعد","saving":"جاري الحفظ…","err":"تعذّر الحفظ. جرّب تاني.","ok":"الرد بيتحفظ لكل من يفتح التقرير. التيستر هيشوفه ويعيد الاختبار.","ro":"تقدر تقرأ الردود هنا. اطلب من صاحب التقرير صلاحية Contributor عشان تكتب.","na":"تخزين الردود غير متاح في هذا العرض."},"none":"مفيش مشاكل بتطابق الفلاتر دي.","rt":"خطة إعادة الاختبار: واقفين فين","rtBody":[["p","الجولة الأولى خلصت. إعادة الاختبار تبدأ لما المطورين يعلّموا QT-01 لـ QT-13 كـ Fixed هنا (أو يبلّغوا الـ tester). QT-01 الأول، لأن فحوصات شاشة الإضافة مينفعش تبدأ قبل ما Quotation تتحفظ."],["h","لما يوصل إصلاح"],["ol",["كرر QT-01 في الشاشة الأول، وبعدين فحوصات Save والتعديل وSubmit اللي اتعملت بنداء الإنشاء.","كرر حالات السيرفر بنداء الإنشاء (QT-08 لـ QT-13 وQT-16 وQT-18 وQT-23) وحالات الشاشة في الشاشة.","نفّذ الحالات المكتوبة تحت «ماتنفذش».","حدّث حالة كل مشكلة في صندوق الـ feedback تحت."]],["h","داتا الاختبار والسجلات اللي فضلت في النظام"],["p","الفحوصات عملت 48 Quotation تجريبية (عناوينها «PW QT ...»): من SAL-QTN-2026-01657 لـ SAL-QTN-2026-01703 والـ Draft المعدّلة SAL-QTN-2026-01674-1. SAL-QTN-2026-01674 ملغية وSAL-QTN-2026-01677 Lost وSAL-QTN-2026-01703 معتمدة (Open)؛ والباقي Drafts. واتعمل Item Price واحد كأثر جانبي (الصنف 2121 وStandard Selling وسعر 100 والـ id هو v09jn3ug67، شوف QT-23). مفيش حاجة اتمسحت. الـ Quotations الموجودة اتقرت بس؛ وSAL-QTN-2026-01655 وSAL-QTN-2026-01656 اتفتحوا من غير تغيير."]],"obs":["الـ SRS بيقول إن بيظهر تحذير لما الكمية أقل من الكمية المتاحة؛ والنظام بيحذّر لما الكمية أكبر من المتاحة («Row 1: quantity 2.0 for item IND182210 is more than the quantity available (-398.0) in warehouse Stores - E»). صياغة الـ SRS باين إنها معكوسة، أكدوها.","قاعدة Delete في الـ SRS بتناقض نفسها: القايمة بتقول Delete بيظهر للـ Draft أو Cancelled بس، وشاشة التفاصيل بتقول للـ Submitted بس. والنظام بيعرض Delete (أيقونة السلة) للـ Draft والمعتمدة والملغية كلهم.","أخطاء نسخ ولصق في الـ SRS: Use case 5 بيقول «view / edit the Delivery Note details»، وStatus في More Info بيقول «It displays the Delivery Note status»، ونافذة Get Items بتقول «search by the sales order name».","Submit وCancel Document بينفذوا فورًا من غير تأكيد (الـ SRS مبيطلبش تأكيد). والـ Quotation اللي حالتها Lost لسه بتعرض Cancel Document وSet as Lost وUpdate Items وCreate.","الـ SRS بيقول إن قايمة الأسعار الافتراضية «Standard Price List»؛ وSelling Settings على السيرفر ده مظبوطة على «Standard Selling». وكمان Selling Settings فيها «Validate selling price» شغالة، فالسعر الأقل من valuation rate بيترفض («Selling rate ... is lower than its valuation rate»)؛ والـ SRS مبيذكرش القاعدة دي.","الـ SRS بيقول إن Save في Auto Repeat بيظهر «Auto Repeat created successfully for this document»؛ وماضغطتش Save عشان ماعملش سجلات Auto Repeat.","قايمة Quotation فيها دلوقتي أكتر من 8,000 سجل وبتزيد أثناء الاختبار (7,963 في البداية و8,011 بعد كده)، يعني فيه مستخدمين تانيين بيعملوا Quotations على السيرفر ده.","لغة حساب Administrator اتغيّرت من إنجليزي لعربي حوالين 12:29 أثناء الفحص؛ والفحوصات اللي بعد كده اتعملت على الشاشات العربي. الشاشات والداتا طلعوا زي بعض في اللغتين."],"obsTitle":"ملاحظات محتاجة قرار من الـ SRS","rd":"إزاي تقرأ التقرير","rdBody":["درجة الخطورة: «حرجة» يعني بتوقف عملية أساسية وملهاش حل بديل. «عالية» يعني بتكسر قاعدة في الـ SRS بتغيّر البيانات أو اللي المستخدم يقدر يعمله. «متوسطة» يعني سلوك غلط وفيه حل بديل. «منخفضة» يعني شكلي أو بسيط. الأولوية P1 لـ P4 هي ترتيب الإصلاح المقترح. «الطبقة» بتقول الإصلاح غالبًا فين؛ بتظهر Backend وFrontend مع بعض لما الدليل بيشاور على عدم توافق بينهم.","أسماء الاختبارات في الملف بتبدأ برقم حالة الاختبار من شيت Delivery Note (TC-DNL وTC-DNA وTC-DNW وTC-DNG وTC-DNM وTC-DND)، فأي فحص بيفشل بنرجع بيه للشيت علطول."]}};

let LANG = 'en';
try { const s = localStorage.getItem('ps-report-lang'); if (s === 'ar' || s === 'en') LANG = s; } catch (e) {}
const L = () => T[LANG];
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v); }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function field(label, ...content) { return h('div', {class:'field'}, h('span', {class:'eyebrow', text:label}), ...content); }
function textOf(b, key) { const a = BUG_AR[b.id]; if (LANG === 'ar' && a) { const m = {title:'t', area:'area', srs:'srs', steps:'steps', expected:'exp', actual:'act', fix:'fix'}[key]; if (a[m] != null) return a[m]; } return b[key]; }
const feedback = new Map();
let dbRef = null, canWrite = true, who = 'Developer';
const statusOf = (id) => (feedback.get(id) || {}).status || 'New';

function renderStatic() {
  const t = L();
  document.documentElement.lang = t.lang; document.title = t.title;

  $('#langBtn').textContent = t.btn;
  const meta = $('#meta'); meta.textContent = '';
  t.meta.forEach(([k, v]) => meta.append(h('span', {}, k + ' ', h('b', {class: v.includes('/') || v.includes('.') ? 'ltr' : '', text:v}))));

function visible(b) {

(async () => {
