<style>

:root[data-theme="dark"] {

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); padding-inline: 16px; padding-block: 0 56px; }

textarea { width: 100%; min-height: 78px; resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
button:disabled { opacity: 0.55; cursor: default; }

summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }

summary .id { font: 500 0.85rem var(--mono); }
summary .t { font-weight: 500; min-width: 0; }
summary .chips { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 0.72rem/1 var(--mono); padding: 4px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.Critical { background: var(--crit-bg); color: var(--crit); } .chip.High { background: var(--high-bg); color: var(--high); }
.chip.Medium { background: var(--med-bg); color: var(--med); } .chip.Low { background: var(--low-bg); color: var(--low); }
.chip.st { background: var(--surface-2); color: var(--fg); }
.chip.st.Fixed, .chip.st.RetestPassed { background: var(--ok-bg); color: var(--ok); }
.chip.st.Reopened { background: var(--crit-bg); color: var(--crit); }
.body { padding: 4px 16px 16px; display: grid; gap: 16px; border-top: 1px solid var(--line); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.field > .eyebrow { display: block; margin-bottom: 5px; }
.field p, .field ol, .field ul { margin: 0; } .field ol, .field ul { padding-inline-start: 20px; }
.field li { margin-block: 2px; }
pre { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 6px; padding: 11px 13px; font: 0.8rem/1.5 var(--mono); overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
figure img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; display: block; }
figcaption { color: var(--muted); font-size: 0.8rem; }
.fb { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; }
.fb .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.fb label { display: grid; gap: 4px; font-size: 0.82rem; color: var(--muted); }
.fb .note { font-size: 0.8rem; color: var(--muted); }
.fb .last { font-size: 0.8rem; color: var(--muted); }
.pass { color: var(--ok); font-weight: 500; } .fail { color: var(--crit); font-weight: 500; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: grid; place-items: center; z-index: 20; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
.small { color: var(--muted); font-size: 0.85rem; }
@media (max-width: 560px) { summary { grid-template-columns: 1fr; } summary .chips { grid-column: 1; } h1 { font-size: 1.4rem; } }
@media (prefers-reduced-motion: no-preference) { details.bug { transition: border-color .15s; } }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lang { font-weight: 500; }
.ltr { direction: ltr; unicode-bidi: isolate; }
pre.ltr { text-align: left; }
.sp { display: block; margin-top: 10px; }

  "expected": "Either the screen shows the four fields and saves the order, or the field names the screen cannot fill are not mandatory.",
  "actual": "No message, no marked field and no new document: the page stays on /sales-orders/new. The server refuses the save without Employee (\"قيمة مفقودة ل أمر بيع: الموظف\"), Name In Contract, Brief and Contract End Date (they are mandatory custom fields of this server, together with Account Type and Contract Start Date), and none of them is on the screen. The same silent failure happened when the order was started from Blanket Order MFG-BLR-2026-00030. So no Sales Order can be created from the new screen; the test orders had to be created through the API.",
  "code": "API without custom_employee -> 417 \"خطأ: قيمة مفقودة ل أمر بيع: الموظف\"; without custom_name_in_contract -> \"Name In Contract\"; without custom_brief -> \"Brief\"; without custom_contract_end_date -> \"تاريخ نهاية العقد\"\nUI: all visible fields filled -> Save -> no modal, no toast, URL unchanged",

 {

  "area": "Details › Create",

  "code": "Create › فاتورة المبيعات / إذن التسليم / الدفع -> popup \"شاشته ليست جزءًا من هذا الإصدار بعد\"; url stays /sales-orders/SAL-ORD-2026-03115",
  "shots": [],
  "fix": "Open the existing Add Sales Invoice / Add Delivery Note screens with the items of the Sales Order (as the Sales Invoice screen already does with Get Items From), and a Payment screen with the order as reference."

mount\" on the first row are refused; an unknown Order Type is refused; the exchange rate is fetched by the server (3.75 for USD) and a rate of 0 or -1 is replaced; duplicate item rows are allowed (Selling Settings allows multiple items); below-valuation prices are refused (validate selling price is on)"],"noTitle":"Not executed, and why","no":["Delete \"Yes\" and the warnings for an order that is amended or linked to other documents (the Delete dialog was opened on a submitted order and cancelled; Delete was never confirmed on any record)","Creating a Delivery Note, Sales Invoice, Payment or Material Request from the order (SO-02 and SO-03 block it), and so the Delivered, Billed, Completed and \"Fully Billed\" progress was checked only on existing orders (SAL-ORD-2026-03109, 03110, 03111, 02786, 02788)","The tables that appear after Save: Taxes and Charges Calculation (per item and per account) and Bundle Items (an order cannot be saved from the screen, SO-01; the create call returned the order, but its tables were not read)","Saving the Update Items popup, the shortage rule (Selling Settings has \"Sales Order item shortage\" on Ignore and was not changed; Warn and Block were not checked), serial and batch, the Reserve Stock effect on a new order, Ensure Delivery by Serial No, Supplier Delivers to Customer with a Purchase Order","Preferred, Primary and latest address and contact selection (the test customers have no preferred address or contact set, so the rule could not be shown), the Payment Terms Template filling the schedule on the screen, the Terms template filling the content, Incoterm and Named Place (hidden), Shipping Rule, Sales Taxes template filling the tax rows","The Hold reason limit of 500 characters by real typing (the field was filled by script), Exchange Rate rules of Accounts Settings (fetching rule, no rate found, the role that edits the rate), the Price List Exchange Rate popup \"No exchange rate was found for AFN to SAR\" on an old order (data, same as SI-05)","Permissions, closed accounting period, credit limit, Auto Repeat, Sales Partner commission and Sales Team (hidden), Loyalty Points earned or redeemed on an order, UTM, Print output"],"bugs":"Bugs","search":"Search id, title, test case","allSev":"All severities","allLayer":"Backend and Frontend","allStatus":"All statuses","of":"of","sev":{"Critical":"Critical","High":"High","Medium":"Medium","Low":"Low"},"status":{"New":"New","In Progress":"In Progress","Fixed":"Fixed","Retest Passed":"Retest Passed","Reopened":"Reopened","Not a Bug":"Not a Bug","Cannot Reproduce":"Cannot Reproduce","Deferred":"Deferred"},"f":{"tc":"Test case","srs":"SRS reference","steps":"Steps to reproduce","exp":"Expected result","act":"Actual result","code":"Backend evidence (request and response)","shots":"Screenshots","fix":"Suggested fix"},"srsPrefix":"Selling SRS v1.0, Sales Order","fb":{"title":"Developer feedback","status":"Status","as":"Assigned to","build":"Build","cm":"Comment","save":"Save feedback","devName":"Developer name","buildPh":"Fixed in build / commit","cmPh":"Root cause, fix notes, or questions for the tester","last":"Last update","by":"by","none":"No feedback yet","saving":"Saving…","err":"Could not save. Try again.","ok":"Saved for everyone who opens this report. The tester sees it and retests.","ro":"You can read feedback here. Ask the report owner for contributor access to write.","na":"Feedback storage is not available in this view."},"none":"No bugs match these filters.","rt":"Retest plan: where we stopped","rtBody":[["p","Round 1 of the Sales Order is finished. Retesting starts when the developers mark SO-01 to SO-09 as Fixed here (or tell the tester). SO-01 comes first because no order can be created from the screen until it is fixed, and SO-02 comes next because the delivery and invoice chain depends on it."],["h","When a fix lands"],["ol",["Repeat SO-01 and SO-04: create an order from the screen with a customer, an item and a delivery date, and press Save on an empty form.","Repeat SO-02 and SO-03 from a submitted order (Skip Delivery Note off), then run the delivery, billing and Completed scenarios and the Taxes and Charges Calculation and Bundle Items tables.","Repeat SO-05 to SO-09 and the server cases through the create call (SO-06, SO-07, SO-14 to SO-18).","Run the cases listed under Not executed.","Update each bug status in the feedback box below."]],["h","Test data and records left in the system"],["p","The checks created Sales Orders for the customer \"PW Test Customer\" (CU-2026-00001) through the API: SAL-ORD-2026-03112 to SAL-ORD-2026-03151 (Drafts, except: 03114 submitted, which went through Hold, Resume, Close and Re-open and is open; 03115 cancelled; 03115-1 a Draft made by Amend). Nothing was deleted. The existing orders (SAL-ORD-2026-03111, 02797, 02777, 02814 and 02815) were only opened or read."]],"obs":["Fields on the screen or the server that are not in the SRS: the contract fields (Account Type, Contract Start Date, Contract End Date, Name In Contract, Employee, Brief, Customer Account) which are mandatory on the server (SO-01), Territories, Order Created by Customer Owner and Retained Customer. They look intentional but the SRS should describe them.","Loyalty Points and Loyalty Amount are shown in More Information (the SRS has them) but a Sales Order has no Loyalty Program redemption; the number is always 0 in the orders read.","Available Qty is negative on the screen (for example -398) because the item has more reserved quantity than stock, which follows the SRS formula (actual minus reserved). The reservations come from the many test orders with Reserve Stock on by default; with Reserve Stock on, the Stock Reservation Entry is created at submit and cancelled by Cancel.","Amend and the cancelled order: Amend saves the new Draft at once (SAL-ORD-2026-03115-1) instead of opening an unsaved copy, as the Sales Invoice screen also does (SI-13). The SRS only says the button changes to Amend.","SRS wording problems: the Get Items From Quotation popup describes \"opportunity\" and \"Opportunity Details\" (copy and paste from another document) and a Name search by \"sales order name\"; Edit Row Item says \"Maintain Stock enabled\" while the table says \"Is Fixed Asset disabled\"; Qty is described as \"Actual Qty minus Reserved Qty\" (that is Available Qty) and the quantity warning is inverted; the Hold popup button is named \"Submit\" (the screen names it Submit too); the Details tab Delivery Date is \"shown only when Skip Delivery Note = 0\" but row delivery dates are mandatory in both cases; Territory is \"Multi selection\" for a single customer territory; the \"Bundle Items\" note says Quotation; Delete is described under List and Details with different rules for an amended and a linked order.","The status \"Confirmed\" of the SRS is shown for every submitted order that is still open (To Deliver, To Bill, To Deliver and Bill); the system stores the ERPNext statuses and the screen maps them, so please confirm whether the original status should be kept visible as the SRS Delivery Status and Billing Status columns suggest.","Submit and Cancel run at once with no confirmation (the SRS does not ask for one). The Sales Order screen is read-only after Submit and Update Items is the only way to change a submitted order."],"obsTitle":"Observations that need an SRS decision","rd":"How to read this report","rdBody":["Severity: Critical blocks a core flow with no workaround. High breaks an SRS rule that changes data or what the user can do. Medium is wrong behaviour with a workaround. Low is cosmetic or minor. Priority P1 to P4 is the suggested fix order. Layer says where the fix most likely lives; Backend and Frontend both appear when the evidence points to a contract mismatch between them.","Test names in the spec start with the test case ID from the Delivery Note sheet (TC-DNL, TC-DNA, TC-DNW, TC-DNG, TC-DNM, TC-DND), so a failing check maps straight back to the sheet."]},"ar":{"dir":"rtl","lang":"ar","btn":"English","title":"تقرير مقارنة Sales Order بالـ SRS","eyebrow":"تقرير مشاكل الجودة · Selling › Sales Order (مقارنة كاملة بالـ SRS)","h1":"Sales Order: 21 فرق عن الـ SRS؛ والشاشة مبتحفظش أمر، وقايمة Create مبتفتحش شاشتي الفاتورة والتسليم","lede":"مقارنة كاملة لقايمة Sales Order وشاشة الإضافة (تابات Details وGeneral Information وMore Information) وشاشة التفاصيل بإجراءاتها (Submit وCancel Document وAmend وHold وResume وClose وRe-open وUpdate Items وCreate) وقواعد السيرفر بالـ SRS (الصفحات 169 لـ 240) على السيرفر التجريبي: 82 فحص (61 مطابق و21 مختلف). Hold وResume وClose وRe-open وCancel وAmend شغالين، ونافذة Update Items بتسمح بالكمية والسعر وتاريخ التسليم بس، وEdit الجماعي بيرفض أمر معتمد، وقايمة الأصناف ماشية بفلتر الـ SRS، ونافذة Purchase Order شغالة، وحسابات الإجماليات والخصم والضريبة صح. أهم مشكلتين SO-01 (مفيش أمر بيتحفظ من الشاشة: حقول العقد الأربعة اللي السيرفر بيطلبها مش في الشاشة وSave مبيعرضش حاجة) وSO-02 (Create › Sales Invoice وDelivery Note وPayment بيقولوا بس إن شاشتهم «مش جزء من الإصدار»). ومن المهم كمان: Create › Material Request بيفشل لغياب قايمة أسعار الشراء (SO-03)، وSave على فورم فاضي مبيعرضش رسالة (SO-04)، وDelete ظاهر للأوامر المعتمدة (SO-05)، والسيرفر بيقبل Additional Discount سالب (SO-06) ومستودع مجمّع وUOM غريب (SO-07).","meta":[["البيئة","test.hr.azzrk.com"],["المتصفح","Chromium (كمبيوتر)"],["المستخدم","Administrator"],["الشركة","Ahmed Ebrahim CO."],["اللغة","واجهة عربي (لغة الحساب: ar)"],["تاريخ التشغيل","2026-11-18"],["الطريقة","فحوصات متصفح بـ Playwright ونداءات على الـ API العادي (لسه مش محفوظة كملف اختبار)"],["أرقام المشاكل","SO-01 لـ SO-21"]],"stats":["إجمالي المشاكل","حرجة","عالية","متوسطة","منخفضة","الإصلاح غالبًا في Backend","الإصلاح غالبًا في Frontend","تم إصلاحها أو إعادة اختبارها"],"cov":"تغطية الاختبار","covHead":["المنطقة","عدد الفحوصات الآلية","نجح","فيه عيب","لم يكتمل"],"covRows":[["شاشة القايمة: الأعمدة والحالات وحالات التسليم والفوترة والتوفر والنسب وشريط الإجراءات (تعديل واسناد ووسوم وتصدير وClear Assignment واعتماد / إلغاء وطباعة وحذف) ورفض Edit الجماعي لأمر معتمد",8,6,2,0],["شاشة الإضافة (تاب Details): الشركة والـ series والعميل والتواريخ وSkip Delivery Note والعملة وقايمة الأسعار والباركود وجدول Items (إضافة وتعديل وحذف وفلتر الأصناف والمتاح والعجز) وEdit Row وSetting وGet Items From Quotation والضرايب والإجماليات وAdditional Discount ورسايل Save ورابط Blanket Order",25,18,7,0],["تابات General Information وMore Information: العناوين وجهات الاتصال وشروط الدفع والـ terms والحالة وتقدم التسليم والفوترة ونقاط الولاء وإعدادات الطباعة والمنطقة وأمر شراء العميل",13,12,1,0],["شاشة التفاصيل والإجراءات: Submit وCancel Document وAmend وHold (قواعد السبب) وResume وClose وRe-open وUpdate Items وCreate (Sales Invoice وDelivery Note وMaterial Request وPurchase Order وPayment) والـ read-only بعد Submit وAmended From",15,12,3,0],["قواعد السيرفر (إنشاء): الطرف والأصناف والكمية والسعر والتواريخ والخصومات والضرايب والمستودع والـ UOM وفلتر الأصناف وOrder Type وأطوال النصوص وسعر الصرف وحقول العقد",18,11,7,0],["الرسائل والتسميات والترجمة",3,2,1,0]],"total":"الإجمالي","covNote":"مفيش شيت test cases لـ Sales Order لسه، فالمشاكل مش مربوطة بأرقام حالات. الفحوصات اتعملت بسكريبتات متصفح وطلبات للسيرفر.","okTitle":"اللي اتأكدنا إنه شغال","ok":["القايمة: ID وStatus وDelivery Status وBilling Status وAvailability Status وCustomer Name وDate وGrand Total و% Billed و% Delivered؛ وزر Add Sales Order؛ وشريط الإجراءات (تحديد الكل وتعديل واسناد وإضافة وسوم وتصدير وClear Assignment وإلغاء للأمر المعتمد واعتماد للـ Draft وطباعة)؛ ونافذة Edit الجماعية لأمر معتمد بترفض بـ «لا يمكن تعديل أمر بيع معتمد أو مكتمل أو ملغي» ونافذة الـ Draft فيها Field وValue وUpdate","الحالات في القايمة والتفاصيل: Draft (مسودة) وConfirmed (مؤكد) وCompleted (مكتمل) وOn Hold (معلق) وClosed (مغلق) وCancelled (ملغي)؛ وAvailability Status Available وBackorder (طلب مؤجل) وNot Applicable؛ وAvailable Qty = الكمية الفعلية ناقص المحجوزة (Bin Stores - E: الفعلي 16 والمحجوز 353، بيظهر بالسالب)","شاشة الإضافة: Company وSeries وCustomer وCustomer Name وTax ID (بيتملوا بالعميل) وDate (للقراءة بس، النهارده) وDelivery Date وSkip Delivery Note وAmended From (بيظهر على أمر معدّل) وCost Center وProject وCurrency وExchange Rate وPrice List وPrice List Currency وIgnore Pricing Rule وScan Barcode وSet Source Warehouse وReserve Stock (Stock Reservation شغال) وItems وTaxes and Charges بـ Tax Category وShipping Rule وTemplate وTotals وAdditional Discount وCoupon Code؛ وOrder Type مخفي","Items: قايمة Item Code بتخبي الأصول الثابتة (2121 وTest Asset) وأصناف الـ template (1111) وأصناف Allow Sales مقفول (Item-123 وasdasd) وبتعرض الخدمات والـ bundles (Ads وBR-1 وSTO-ITEM-2026-00077)؛ وAvailable Qty وShortage Qty ظاهرين؛ وEdit Row فيه Item وItem Group وItem Name وBrand وImage وDelivery Date وEnsure Delivery by Serial No وReserve Stock وDescription وQty وحقول UOM والتحويل وPrice List Rate وMargin والخصومات وRate وAmount وItem Tax Template وPricing Rules وNet Rate وBilled Amount وValuation Rate وGross Profit وSupplier Delivers to Customer والأوزان وAgainst Blanket Order وQuotation ومستويات المخزون وCost Center / Project؛ وEdit Row للضريبة فيه Type وAccount Head وDescription وIncluded in Basic Rate وConsidered in Paid Amount وCost Center وProject وTax Rate والمبالغ","رسايل Save مع عميل: من غير أصناف «أضف صنفًا واحدًا على الأقل إلى أمر البيع»؛ وتاريخ تسليم ناقص «الرجاء إدخال تاريخ التسليم»؛ ومع صنف كمية الصف بتتملي بـ 1","Get Items From Quotation: نافذة فيها Search بالاسم وCustomer وجدول عروض الأسعار المفتوحة؛ وعرض السعر المختار (SAL-QTN-2026-01703) بيضيف صنفه بكمية 2 وسعر 10200 وبيحدد العميل","General Information: Billing Address بنص العنوان وContact Person بالتليفون الرئيسي والإيميل الرئيسي موضّحين وShipping Address وCompany Address (الرئيسي) وPayment Terms Template وPayment Schedule وTerms and Conditions؛ وMore Information: Status وDelivery Status و% Delivered وAvailability Status و% Billed و% Picked وBilling Status وReturned Qty وTerritory وCustomer Purchase Order وتاريخه وLoyalty Points وLoyalty Amount (ظاهرين، والـ SRS فيه الحاجتين دول) وLetter Head وLanguage وPrint without Amount وGroup Same Items؛ وCommission وSales Team وAuto Repeat وUTM مخفيين","التفاصيل بالحالة: الـ Draft فيه Submit وGet Items From Quotation؛ والمعتمد فيه Cancel Document وHold وClose وUpdate Items وCreate وللقراءة بس؛ وCancel بيلغي حجوزات المخزون وبيعرض «تم إلغاء أمر البيع بنجاح» والزر بيبقى Amend («تعديل»)؛ وAmend بيفتح Draft جديد (SAL-ORD-2026-03115-1) بـ «معدّل من SAL-ORD-2026-03115»؛ والأمر On Hold بيعرض Resume والمغلق بيعرض Re-open؛ وتاب Linked Records موجود","Hold: النافذة بتطلب «سبب التعليق» (إجباري وعداد x / 500) وبترفض سبب فاضي («سبب التعليق مطلوب») وسبب من حرفين («يجب ألا يقل عن 3 أحرف»)؛ وResume وClose وRe-open شغالين؛ وUpdate Items بيسمح بالكمية والسعر وتاريخ التسليم للصفوف الموجودة بس","قايمة Create: Delivery Note بيظهر لما Skip Delivery Note مقفول بس؛ ونافذة Purchase Order فيها Supplier وجدول بـ Item Code وItem Name وPending Quantity وUOM وSupplier إجباري لكل صف وإلغاء وإنشاء","السيرفر: العميل وEmployee وName in Contract وBrief وContract End Date إجباريين؛ والكمية 0 بتترفض («كمية البند IND182210 لا يمكن أن يكون صفرا»)؛ وصنف template وصنف مش للبيع بيترفضوا؛ وخصم 150٪ وخصم أكبر من الإجمالي بيترفضوا؛ وخصم 10٪ على Net Total بيدي 9180؛ وصف ضريبة من غير حساب و«On Previous Row Amount» في الصف الأول بيترفضوا؛ وOrder Type مجهول بيترفض؛ وسعر الصرف بيتجاب من السيرفر (3.75 للدولار) وسعر 0 أو -1 بيتبدّل؛ وصفوف الصنف المكررة مسموحة (Selling Settings بتسمح بأصناف متعددة)؛ والسعر الأقل من الـ valuation بيترفض (validate selling price شغال)"],"noTitle":"اللي ماتنفذش وليه","no":["«Yes» في الحذف وتحذيرات أمر معدّل أو مرتبط بمستندات تانية (نافذة Delete اتفتحت على أمر معتمد واتلغت؛ ومااكدتش الحذف على أي سجل)","عمل Delivery Note أو Sales Invoice أو Payment أو Material Request من الأمر (SO-02 وSO-03 بيمنعوه)، فتقدم Delivered وBilled وCompleted وFully Billed اتفحص على أوامر موجودة بس (SAL-ORD-2026-03109 و03110 و03111 و02786 و02788)","الجداول اللي بتظهر بعد Save: Taxes and Charges Calculation (لكل صنف ولكل حساب) وBundle Items (الأمر مبيتحفظش من الشاشة، SO-01؛ ونداء الإنشاء رجّع الأمر لكن جداوله ماتقراتش)","حفظ نافذة Update Items وقاعدة العجز (Selling Settings «Sales Order item shortage» على Ignore وماغيّرتوش؛ Warn وBlock ماتفحصوش) وserial وbatch وأثر Reserve Stock على أمر جديد وEnsure Delivery by Serial No وSupplier Delivers to Customer مع Purchase Order","اختيار العنوان وجهة الاتصال (Preferred وPrimary وآخر واحدة: عملاء الاختبار ملهمش preferred فالقاعدة ماظهرتش) وملء جدول شروط الدفع من Payment Terms Template في الشاشة وملء الـ terms من القالب وIncoterm وNamed Place (مخفيين) وShipping Rule وملء صفوف الضرايب من قالب الضرايب","حد 500 حرف لسبب Hold بالكتابة الحقيقية (الحقل اتملا بسكريبت) وقواعد Exchange Rate في Accounts Settings (قاعدة الجلب وحالة عدم وجود سعر والـ role اللي يعدّل السعر) ونافذة Price List Exchange Rate «No exchange rate was found for AFN to SAR» على أمر قديم (داتا، زي SI-05)","الصلاحيات والفترة المحاسبية المقفولة وحد الائتمان وAuto Repeat وعمولة Sales Partner وSales Team (مخفيين) ونقاط الولاء المكسوبة أو المستبدلة على أمر وUTM ومخرجات الطباعة"],"bugs":"المشاكل","search":"ابحث بالرقم أو العنوان أو رقم الحالة","allSev":"كل درجات الخطورة","allLayer":"Backend وFrontend","allStatus":"كل الحالات","of":"من","sev":{"Critical":"حرجة","High":"عالية","Medium":"متوسطة","Low":"منخفضة"},"status":{"New":"جديدة","In Progress":"جاري العمل","Fixed":"تم الإصلاح","Retest Passed":"نجحت إعادة الاختبار","Reopened":"أُعيد فتحها","Not a Bug":"ليست مشكلة","Cannot Reproduce":"لا يمكن إعادة الإنتاج","Deferred":"مؤجلة"},"f":{"tc":"رقم حالة الاختبار","srs":"مرجع الـ SRS","steps":"خطوات إعادة الإنتاج","exp":"النتيجة المتوقعة","act":"النتيجة الفعلية","code":"دليل الباك إند (الطلب والرد)","shots":"لقطات الشاشة","fix":"الحل المقترح"},"srsPrefix":"Selling SRS v1.0, Sales Order","fb":{"title":"رد المطور","status":"الحالة","as":"المسؤول","build":"الإصدار","cm":"تعليق","save":"حفظ الرد","devName":"اسم المطور","buildPh":"اتصلحت في إصدار / commit","cmPh":"سبب المشكلة، أو ملاحظات الإصلاح، أو أسئلة للتيستر","last":"آخر تحديث","by":"بواسطة","none":"لا يوجد رد بعد","saving":"جاري الحفظ…","err":"تعذّر الحفظ. جرّب تاني.","ok":"الرد بيتحفظ لكل من يفتح التقرير. التيستر هيشوفه ويعيد الاختبار.","ro":"تقدر تقرأ الردود هنا. اطلب من صاحب التقرير صلاحية Contributor عشان تكتب.","na":"تخزين الردود غير متاح في هذا العرض."},"none":"مفيش مشاكل بتطابق الفلاتر دي.","rt":"خطة إعادة الاختبار: واقفين فين","rtBody":[["p","الجولة الأولى لـ Sales Order خلصت. إعادة الاختبار تبدأ لما المطورين يعلّموا SO-01 لـ SO-09 كـ Fixed هنا (أو يبلّغوا الـ tester). SO-01 الأول لأن مفيش أمر بيتعمل من الشاشة قبل ما يتصلح، وبعده SO-02 لأن سلسلة التسليم والفوترة معتمدة عليه."],["h","لما يوصل إصلاح"],["ol",["كرر SO-01 وSO-04: اعمل أمر من الشاشة بعميل وصنف وتاريخ تسليم، ودوس Save على فورم فاضي.","كرر SO-02 وSO-03 من أمر معتمد (Skip Delivery Note مقفول)، وبعدين شغّل سيناريوهات التسليم والفوترة وCompleted وجداول Taxes and Charges Calculation وBundle Items.","كرر SO-05 لـ SO-09 وحالات السيرفر بنداء الإنشاء (SO-06 وSO-07 وSO-14 لـ SO-18).","نفّذ الحالات المكتوبة تحت «ماتنفذش».","حدّث حالة كل مشكلة في صندوق الـ feedback تحت."]],["h","داتا الاختبار والسجلات اللي فضلت في النظام"],["p","الفحوصات عملت Sales Orders للعميل «PW Test Customer» (CU-2026-00001) بالـ API: من SAL-ORD-2026-03112 لـ SAL-ORD-2026-03151 (Drafts، ما عدا: 03114 معتمد وعدّى على Hold وResume وClose وRe-open وهو مفتوح؛ و03115 ملغي؛ و03115-1 Draft اتعمل بـ Amend). مفيش حاجة اتمسحت. والأوامر الموجودة (SAL-ORD-2026-03111 و02797 و02777 و02814 و02815) اتفتحت أو اتقرت بس."]],"obs":["حقول في الشاشة أو السيرفر مش في الـ SRS: حقول العقد (Account Type وContract Start Date وContract End Date وName In Contract وEmployee وBrief وCustomer Account) وهي إجبارية في السيرفر (SO-01) وTerritories وOrder Created by Customer Owner وRetained Customer. باين إنها مقصودة لكن لازم الـ SRS يوصفها.","Loyalty Points وLoyalty Amount ظاهرين في More Information (والـ SRS فيه الحاجتين) لكن Sales Order مفيهوش استبدال Loyalty Program؛ والرقم دايما 0 في الأوامر ا
