const T = {"en":{"dir":"ltr","lang":"en","btn":"عربي","title":"Sales Taxes and Charges Template Bug Report","eyebrow":"QA bug report · Selling › Sales Taxes and Charges Template","h1":"Sales Taxes and Charges Template: 11 differences from the SRS, mostly missing server rules","lede":"Comparison of the Sales Taxes and Charges Template list, the Add and Details screens and the server rules with the SRS (pages 75 to 86), on the test server: 33 checks (22 matched, 11 differ). This module is the closest to the SRS so far: the screen messages, the Mode values, the Account Head list (Profit & Loss accounts of the selected company only), the automatic Reference Row, the Connections and the fixed page actions all match. The gaps are on the server, which does not enforce the Title length (ST-01), the Description length (ST-02) or the Profit & Loss rule for the Account Head (ST-03), and a few screen details: a silent Save on an untouched form (ST-06), a Draft badge on Details (ST-07), the Setting popup and the missing No. column (ST-08), English ZATCA labels (ST-09) and the missing Don't Recompute Tax (ST-10).","meta":[["Environment","test.hr.azzrk.com"],["Browser","Chromium (desktop)"],["User","Administrator"],["Company","Ahmed Ebrahim CO."],["Language","Arabic (the template screens)"],["Run date","2026-11-16"],["Method","Playwright browser checks and calls to the create endpoint (not saved as a spec yet)"],["Bug IDs","ST-01 to ST-11 (this module only)"]],"stats":["Bugs reported","Critical","High","Medium","Low","Backend first","Frontend first","Fixed or retested"],"cov":"Test coverage","covHead":["Area","Automated checks","Passed","Defect found","Not completed"],"covRows":[["List screen: columns, Status, Default and Disabled, Add button, action bar",3,2,1,0],["Add screen: Title limits and messages, Company and Tax Category dropdowns, Default / Disabled, Add Row and Delete row, Mode values, Account Head list, Reference Row, Rate and Amount fields, Description limits, untouched Save, Setting popup, No. column, Edit Row fields and labels",15,11,4,0],["Details screen: fields, fixed actions, Connections, delete confirmation, header status",5,4,1,0],["Server rules (create): Title mandatory and length, Mode and Account Head mandatory, Description length, Balance Sheet account, disabled and default, Tax Category, previous-row rules and their messages",10,5,5,0]],"total":"Total","covNote":"There is no Sales Taxes and Charges Template test-case sheet yet, so the defects above are not linked to case IDs. The checks were run through browser scripts and requests.","okTitle":"Verified working","ok":["List: ID, Status (Enabled / Disabled), Default, Disabled and Company columns; Add button; action bar with Select All, Edit, Export, Assign, Add Tags, Print and Delete; the bulk Edit popup lists Title, Default, Disabled, Company and Tax Category","Add: Title stops at 100 characters and shows \"يجب أن يتكون العنوان من حرفين على الأقل\" under 2; Company is mandatory (\"الشركة مطلوبة\") and a searchable dropdown; Tax Category is a searchable dropdown; Default and Disabled checkboxes exist","Tax table: the Mode list has the five values (Actual, On Net Total, On Previous Row Amount, On Previous Row Total, On Item Quantity); the Account Head list shows only Profit & Loss accounts of the selected company; an empty row shows \"الحساب مطلوب\"; Rate takes numbers only and stops at 100 characters; Add Row and Delete row work","Reference Row appears when the Mode is On Previous Row and is filled with the previous row (\"صف 1\"); Description shows \"يجب أن يتكون الوصف من 3 أحرف على الأقل\" and stops at 500 characters","Edit Row: Mode, Account Head, Is Tax Included In Basic Rate, Considered In Paid Amount, Tax Rate, Account Currency, Net Amount, Total, Tax Amount After Discount, Description, Cost Center, Project and the company-currency labels; Add / Remove columns lists the SRS columns","Details: the fields with their data; Assign, Tags, Attachments, Print, Share and Delete; Connections with Sales Invoice, Sales Order, Delivery Note, POS Profile, Subscription and Tax Rule (38 linked records on \"VAT - E\"); Delete asks for confirmation and Cancel closes it","Server: a missing Title, a missing Mode (Type), an invalid Tax Category and a disabled template that is also the default are refused; the previous-row Mode on the first row and a Reference Row that is not before the current row are refused"],"noTitle":"Not executed, and why","no":["Saving and editing a template from the screen with valid data (Save with all mandatory fields filled was not clicked, to avoid creating records)","Delete \"Yes\" on a template that is linked to transactions and the warning with the linked doctypes as links (Delete was not confirmed on real templates; \"VAT - E\" has 38 linked records)","Column width, drag and drop of columns, Export, Assign, Print, tags and the Edit popup update of the list","Is Tax Withholding Account and Set by Item Tax Template (the SRS shows them only for such rows), the Tax Rate range and a negative rate (the server answered only with the ZATCA rule \"Tax Code S must have a rate of 15%\", so no generic rule could be seen)","The Disabled template being hidden in new transactions, and the Default template being picked automatically in a Sales Invoice for the company"],"bugs":"Bugs","search":"Search id, title, test case","allSev":"All severities","allLayer":"Backend and Frontend","allStatus":"All statuses","of":"of","sev":{"Critical":"Critical","High":"High","Medium":"Medium","Low":"Low"},"status":{"New":"New","In Progress":"In Progress","Fixed":"Fixed","Retest Passed":"Retest Passed","Reopened":"Reopened","Not a Bug":"Not a Bug","Cannot Reproduce":"Cannot Reproduce","Deferred":"Deferred"},"f":{"tc":"Test case","srs":"SRS reference","steps":"Steps to reproduce","exp":"Expected result","act":"Actual result","code":"Backend evidence (request and response)","shots":"Screenshots","fix":"Suggested fix"},"srsPrefix":"Selling SRS v1.0, Sales Taxes and Charges Template","fb":{"title":"Developer feedback","status":"Status","as":"Assigned to","build":"Build","cm":"Comment","save":"Save feedback","devName":"Developer name","buildPh":"Fixed in build / commit","cmPh":"Root cause, fix notes, or questions for the tester","last":"Last update","by":"by","none":"No feedback yet","saving":"Saving…","err":"Could not save. Try again.","ok":"Saved for everyone who opens this report. The tester sees it and retests.","ro":"You can read feedback here. Ask the report owner for contributor access to write.","na":"Feedback storage is not available in this view."},"none":"No bugs match these filters.","rt":"Retest plan: where we stopped","rtBody":[["p","Round 1 is finished. Retesting starts when the developers mark ST-01, ST-02, ST-03 and ST-06 as Fixed here (or tell the tester)."],["h","When a fix lands"],["ol",["Repeat the case through the create endpoint (ST-01 to ST-05 can only be seen there) and on the screen (ST-06 to ST-11).","Run the cases listed under Not executed.","Update each bug status in the feedback box below."]],["h","Test data and records left in the system"],["p","The server checks created 16 test templates that were not deleted (nothing is deleted by the tests): \"PW ST ...\" templates, one \"a - E\", one with a 101-character title, one with a 100-character title and one with no tax rows. While testing, a second default template for the same company switched off the Default flag of \"عنوان قالب ضريبى جديد - E\"; the flag was set back on that template, and the \"PW ST DEF 30930\" templates are no longer default. The existing templates were only read."]],"obs":["The SRS does not say the tax rows are mandatory or that a template Title must be unique: the server saves a template with no tax rows and a second template with the same Title (it gets the ID \"... - E-1\"). Confirm both with the SRS owner.","The server saves a template without a Company by using the default company of the session; the screen     h('div', {class:'row'}, h('label', {}, t.fb.status, sel), h('label', {}, t.fb.as, who_), h('label', {}, t.fb.build, ver)),
    h('label', {}, t.fb.cm, cm), h('div', {class:'row'}, save, msg),
    h('span', {class:'note', text: dbRef ? (canWrite ? t.fb.ok : t.fb.ro) : t.fb.na})));
  d.append(body); return d;
}
function visible(b) {
  const q = $('#q').value.trim().toLowerCase(), sev = $('#fSev').value, layer = $('#fLayer').value, st = $('#fStatus').value;
  if (sev && b.sev !== sev) return false;
  if (layer && b.layer !== layer && b.also !== layer) return false;
  if (st && statusOf(b.id) !== st) return false;
  if (q && !(b.id + ' ' + b.title + ' ' + (BUG_AR[b.id] ? BUG_AR[b.id].t : '') + ' ' + b.tc.join(' ') + ' ' + b.area).toLowerCase().includes(q)) return false;
  return true;
}
function renderBugs() {
  const open = new Set([...document.querySelectorAll('details.bug[open]')].map(x => x.id));
  const focusId = document.activeElement && document.activeElement.id;
  const list = BUGS.filter(visible), wrap = $('#bugs'); wrap.textContent = '';
  for (const b of list) { const el = bugEl(b); if (open.has(b.id)) el.open = true; wrap.append(el); }
  if (!list.length) wrap.append(h('p', {class:'small', text:L().none}));
  $('#count').textContent = list.length + ' ' + L().of + ' ' + BUGS.length;
  if (focusId) { const f = document.getElementById(focusId); if (f) f.focus(); }
  renderStats();
}
function setLang(l) { LANG = l; try { localStorage.setItem('ps-report-lang', l); } catch (e) {} renderStatic(); renderBugs(); }
function init() {
  $('#langBtn').addEventListener('click', () => setLang(LANG === 'en' ? 'ar' : 'en'));
  ['q','fSev','fLayer','fStatus'].forEach(id => $('#' + id).addEventListener('input', renderBugs));
  document.addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG' && e.target.closest('figure')) {
      const lb = h('div', {class:'lightbox', role:'dialog', 'aria-label':'Screenshot'}, h('img', {src:e.target.src, alt:e.target.alt}));
      lb.addEventListener('click', () => lb.remove()); document.body.append(lb);
    }
  });
  renderStatic(); renderBugs();
  if (location.hash.length > 1) { const t = document.getElementById(location.hash.slice(1)); if (t && t.tagName === 'DETAILS') { t.open = true; t.scrollIntoView(); } }
}
init();
(async () => {
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db) return;
    dbRef = db;
    if (user) { try { const me = await user.me(); if (me && me.name) who = me.name; } catch (e) {} const w = user.can && user.can('data.write'); if (w === false) canWrite = false; }
    db.collection('bugs').onSnapshot((snap) => { feedback.clear(); snap.docs.forEach(d => feedback.set(d.id, d.data())); renderBugs(); }, () => { renderBugs(); });
    renderBugs();
  } catch (e) { /* feedback stays unavailable; the report still reads fine */ }
})();
</script>
