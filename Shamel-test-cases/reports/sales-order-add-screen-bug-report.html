.fb .note { font-size: 0.8rem; color: var(--muted); }
.fb .last { font-size: 0.8rem; color: var(--muted); }
.pass { color: var(--ok); font-weight: 500; } .fail { color: var(--crit); font-weight: 500; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: grid; place-items: center; z-index: 20; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
.small { color: var(--muted); font-size: 0.85rem; }
@media (max-width: 560px) { summary { grid-template-columns: 1fr; } summary .chips { grid-column: 1; } h1 { font-size: 1.4rem; } }

 {
  "id": "SO-01",
  "sev": "High",
  "pri": "P1",
  "layer": "Frontend",
  "title": "A Sales Order cannot be saved from the screen: four fields the server requires are not on any tab of the Add screen",
  "area": "Add Sales Order › Details",
  "tc": [],
  "srs": "Add Sales Order (pages 173 to 214): a Sales Order is saved with Save when the required fields are filled; the SRS lists no Employee, Name In Contract, Brief or Contract End Date field.",
  "steps": [
   "Open Selling › Sales Orders › Add Sales Order.",
   "Fill every field of the three tabs that can be filled (customer \"PW Test Customer\", dates, currency, price list, warehouse, item IND182210 with quantity 3 and rate 10500, Edit Row fields, tax template, shipping rule, additional discount, addresses, payment terms, terms, purchase order, letter head, print options).",
   "Press Save and wait about 10 seconds.",
   "Compare with the create call that adds Employee, Name In Contract, Brief and Contract End Date (the call saves SAL-ORD-2026-03112)."
  ],
  "expected": "Either the screen shows the four fields and saves the order, or the field names the screen cannot fill are not mandatory.",
  "actual": "Correction (2026-11-18, full fill run, headed browser): after about 6 to 7 seconds a popup \"تعذّر الحفظ\" lists \"قيمة مفقودة ل أمر بيع: Name In Contract\", \"تاريخ نهاية العقد\", \"الموظف\" and \"Brief\". During those seconds nothing shows (no loading state, no message), which is why an earlier check that waited 5 seconds saw nothing. No field is marked, no new document is created and the page stays on /sales-orders/new. The four fields are mandatory custom fields of this server (with Account Type and Contract Start Date) and none of them is on any of the three tabs, so the user cannot fix the error. Result of the real UI run: the Sales Order was NOT added. The same happened when the order was started from Blanket Order MFG-BLR-2026-00030. The test orders had to be created through the API.",
  "code": "UI run so5-fill (every fillable field filled) -> Save -> after ~7 s popup: \"تعذّر الحفظ | خطأ: قيمة مفقودة ل أمر بيع: Name In Contract | تاريخ نهاية العقد | الموظف | Brief\"; URL stays /sales-orders/new\nAPI without custom_employee -> 417 \"خطأ: قيمة مفقودة ل أمر بيع: الموظف\"; without custom_name_in_contract -> \"Name In Contract\"; without custom_brief -> \"Brief\"; without custom_contract_end_date -> \"تاريخ نهاية العقد\"",
  "shots": [],
  "fix": "Add the contract fields (Account Type, Contract Start / End Date, Name In Contract, Employee, Brief) to the screen, or make them optional; and always show the server message when a save fails (see SO-04)."
 },
 {
  "id": "SO-04",
  "sev": "Medium",
  "pri": "P2",
  "layer": "Frontend",
  "title": "Save on an empty form shows no message and marks no field",
  "area": "Add Sales Order › Save",
  "tc": [],
  "srs": "Company, Series, Customer, Date and Currency (pages 173 to 175): \"If the field is left empty, an error message will appear\". Save (page 213): \"A validation error message is displayed for each invalid field\".",
  "steps": [
   "Open Add Sales Order and clear nothing, choose nothing.",
   "Press Save and watch the screen for 3 seconds."
  ],
  "expected": "A message (or a red mark and text) on the empty required field, here Customer.",
  "actual": "Nothing appears: no popup, no inline error, no red border. (With a customer and an item but no delivery date the popup \"تعذّر الحفظ: الرجاء إدخال تاريخ التسليم\" does appear, and with no items \"أضف صنفًا واحدًا على الأقل\", so only the empty-customer case is silent.)",
  "code": "Empty form -> Save -> .cd-error count 0, modal count 0 (0.4 s and 3 s after the click)",
  "shots": [],
  "fix": "Validate the required fields on the screen and show one message per field, as the Sales Invoice screen does."
 },
 {
  "id": "SO-06",
  "sev": "Medium",
  "pri": "P2",
  "layer": "Backend",
  "title": "A negative Additional Discount (percentage or amount) is accepted and raises the order total",
  "area": "Add Sales Order › Additional Discount",
  "tc": [],
  "srs": "Additional Discount (page 202): numbers only; \"Additional Discount Amount cannot exceed the total\" is the only limit; a discount should reduce the total.",
  "steps": [
   "Create an order with one item of 10200 through the create call.",

  "expected": "A refusal (\"discount cannot be negative\").",

  "code": "additional_discount_percentage: -10 -> SAL-ORD-2026-03132 grand_total 11220\ndiscount_amount: -500 -> SAL-ORD-2026-03133 grand_total 10700",
  "shots": [],
  "fix": "Refuse a negative discount percentage and amount."
 },
 {
  "id": "SO-07",
  "sev": "Medium",
  "pri": "P2",
  "layer": "Backend",
  "title": "The server accepts a group warehouse and a UOM that the item does not have",

  "expected": "Both refused.",

  "code": "warehouse \"All Warehouses - E\" -> saved SAL-ORD-2026-03128\nuom \"Nos\" -> saved SAL-ORD-2026-03129 (conversion_factor 1, stock_qty 1)",
  "shots": [],
  "fix": "Validate on the server that the warehouse is not a group and that the UOM is in the item UOM table."
 },
 {
  "id": "SO-08",
  "sev": "Medium",
  "pri": "P2",
  "layer": "Frontend",

  "code": "Row inputs: qty 10, rate 10200; summary: إجمالي الكمية 10.5, الإجمالي 102,000.00 SAR",

 {

  "code": "More Information › حالة الدفعة المقدمة: غير مطلوبة",
  "shots": [],

 {

  "sev": "Low",
  "pri": "P3",
  "layer": "Frontend",

  "area": "Add Sales Order › Items › Setting (gear)",
  "tc": [],

  "code": "Gear popup text: تعديل الأعمدة | اسم الحقل | عرض العمود | إضافة/إزالة حقول | إلغاء | حفظ\nAvailable fields popup: الحقول المتاحة | إلغاء | إضافة (no checkboxes)",
  "shots": [],

 {
